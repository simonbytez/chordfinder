<style>
  :root {
    --bg: #0d0a0b; --ink: #f6efe6; --dim: rgba(246, 239, 230, 0.62); --faint: rgba(246, 239, 230, 0.32);

    --red: #d42a48; --gold: #f2b84b;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border-radius: 16px; }

  header { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; }
  header > * { pointer-events: auto; }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand a { color: var(--dim); text-decoration: none; font-size: 13px; letter-spacing: 0.02em; }
  .brand a:hover { color: var(--ink); }
  .brand h1 { margin: 0; font: 800 28px/1 var(--display); letter-spacing: -0.01em; }
  .brand h1 span { color: var(--red); }
  .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; align-items: center; padding: 6px; }
  .chip { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); border-radius: 999px; padding: 7px 12px; font-size: 13px; white-space: nowrap; }
  .chip:hover { background: rgba(255, 255, 255, 0.1); }
  .chip[aria-pressed="true"] { background: var(--ink); color: #1a1010; border-color: var(--ink); }
  .tempo { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; font-size: 13px; color: var(--dim); }
  .tempo input { width: 96px; accent-color: var(--gold); }
  .tempo b { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2.2em; display: inline-block; }

  .beat { position: fixed; left: 50%; transform: translateX(-50%); top: calc(max(14px, env(safe-area-inset-top)) + 66px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #count { display: flex; gap: 4px; padding: 6px 8px; }
  #count span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; font: 700 16px/1 var(--display); color: var(--faint); transition: background 0.08s, color 0.08s; font-variant-numeric: tabular-nums; }
  #count span.on { background: var(--red); color: #fff; }
  #count span.pause.on { background: rgba(255, 255, 255, 0.16); color: var(--ink); }
  .nowline { font-size: 13px; color: var(--dim); text-shadow: 0 1px 8px #000; }
  .nowline b { color: var(--ink); font-weight: 600; }

  footer { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; pointer-events: none; }
  footer > * { pointer-events: auto; }
  #hint { color: var(--dim); }
  #hint:not(:empty)::before { content: "—"; margin: 0 8px; color: var(--faint); }
  .nowline { max-width: calc(100vw - 32px); text-align: center; }
  #queue { font-size: 13px; color: var(--dim); background: rgba(13, 10, 11, 0.45); border-radius: 999px; padding: 3px 12px; display: flex; align-items: center; gap: 6px; text-shadow: 0 1px 8px #000; }
  #queue b { color: var(--gold); font-weight: 600; }
  #clearq { border: 0; background: rgba(255, 255, 255, 0.1); border-radius: 999px; width: 22px; height: 22px; font-size: 11px; line-height: 22px; padding: 0; }
  #moves { display: flex; gap: 8px; padding: 8px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  #moves::-webkit-scrollbar { display: none; }
  .move { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 10px 14px; text-align: left; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
  .move:hover { background: rgba(255, 255, 255, 0.1); }
  .move:active { transform: scale(0.97); }
  .move .name { font: 700 16px/1.1 var(--display); }
  .move .meta { font-size: 12px; color: var(--faint); }
  .move.active { border-color: var(--red); background: rgba(212, 42, 72, 0.22); }
  .move.active .meta { color: var(--dim); }

  #start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(13, 10, 11, 0.45), rgba(13, 10, 11, 0.88)); transition: opacity 0.5s; z-index: 5; padding: 16px; }
  #start.gone { opacity: 0; pointer-events: none; }
  .card { max-width: 420px; width: 100%; padding: 28px 26px 22px; text-align: center; }
  .card h2 { margin: 0 0 6px; font: 800 40px/1 var(--display); letter-spacing: -0.02em; }

  .bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin: 0 0 16px; }
  #progress { height: 100%; width: 0; background: linear-gradient(90deg, var(--red), var(--gold)); transition: width 0.2s; }
  #go { width: 100%; border: 0; border-radius: 12px; padding: 14px; font: 700 17px/1 var(--display); background: var(--red); color: #fff; }

  #silent { margin-top: 10px; border: 0; background: none; color: var(--dim); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  #loading { margin: 12px 0 0; font-size: 12px; color: var(--faint); }
  .keys { margin-top: 14px; font-size: 12px; color: var(--faint); }
  kbd { font: 600 11px/1 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; color: var(--dim); }

  @media (max-width: 760px) {
    header { flex-direction: column; align-items: stretch; gap: 8px; }
    .brand h1 { font-size: 22px; }
    .controls { justify-content: flex-start; border-radius: 14px; }
    .chip { padding: 6px 10px; font-size: 12px; }
    .tempo input { width: 76px; }
    .beat { top: calc(max(14px, env(safe-area-inset-top)) + 128px); }
    #hint { display: none; }
    #count span { width: 26px; height: 26px; font-size: 14px; }
    .move { padding: 8px 12px; }
    .move .name { font-size: 14px; }
    .keys { display: none; }

    .controls { max-width: 50vw; padding: 4px; }

    #count span { width: 24px; height: 24px; font-size: 13px; }
    #hint { display: none; }
    .move { padding: 6px 10px; }
    .move .name { font-size: 14px; }
    .move .meta { display: none; }
  }

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- motion.js ----
const __motion = (() => {
// Salsa Bones motion engine. Two dancers, a leader and a follower, dance
// on1 to the music's counts. Each move is written as counted footwork (which
// foot steps where on 1, 2, 3, 5, 6, 7), turns and pivots, and hand holds.
// That choreography becomes full-body motion:
//   - feet are planted until they step, swing in a natural arc, and pivot on the ball
//   - weight moves between the feet; the pelvis follows it (with Cuban hip motion)
//     through critically damped springs, which gives real momentum and lag
//   - legs and arms are solved with two-bone inverse kinematics
//   - the spine counter-rotates so the chest stays with the partner
//   - heads look at the partner and spot during turns
//   - connected hands share one point, so both arms answer to each other
// Plain math, no three.js, so it also runs in Node for testing.

// ---------- vectors ----------
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const madd = (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp(t, 0, 1); return t * t * t * (t * (6 * t - 15) + 10); };
const lerpN = (a, b, t) => a + (b - a) * t;
const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const RAD = Math.PI / 180;

// Facing: yaw 0 looks along +z; positive yaw turns to the dancer's left.
const fwdOf = yaw => [Math.sin(yaw), 0, Math.cos(yaw)];
const leftOf = yaw => [Math.cos(yaw), 0, -Math.sin(yaw)];
const UP = [0, 1, 0];

// Rotates v about axis (unit) by angle
function rotAxis(v, axis, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return add(add(mul(v, c), mul(cross(axis, v), s)), mul(axis, dot(axis, v) * (1 - c)));
}

// A frame is { o: origin, x, y, z } with x = y × z. Bones point along +y and face +z.
function frame(o, y, zHint) {
  const Y = norm(y);
  let Z = sub(zHint, mul(Y, dot(zHint, Y)));
  if (len(Z) < 1e-6) Z = sub([0, 0, 1], mul(Y, Y[2]));
  Z = norm(Z);
  return { o, x: cross(Y, Z), y: Y, z: Z };
}

function quatFromFrame(f) {
  const m00 = f.x[0], m01 = f.y[0], m02 = f.z[0];
  const m10 = f.x[1], m11 = f.y[1], m12 = f.z[1];
  const m20 = f.x[2], m21 = f.y[2], m22 = f.z[2];
  const tr = m00 + m11 + m22;
  let x, y, z, w;
  if (tr > 0) { const s = Math.sqrt(tr + 1) * 2; w = s / 4; x = (m21 - m12) / s; y = (m02 - m20) / s; z = (m10 - m01) / s; }
  else if (m00 > m11 && m00 > m22) { const s = Math.sqrt(1 + m00 - m11 - m22) * 2; w = (m21 - m12) / s; x = s / 4; y = (m01 + m10) / s; z = (m02 + m20) / s; }
  else if (m11 > m22) { const s = Math.sqrt(1 + m11 - m00 - m22) * 2; w = (m02 - m20) / s; x = (m01 + m10) / s; y = s / 4; z = (m12 + m21) / s; }
  else { const s = Math.sqrt(1 + m22 - m00 - m11) * 2; w = (m10 - m01) / s; x = (m02 + m20) / s; y = (m12 + m21) / s; z = s / 4; }
  return [x, y, z, w];
}

// Critically damped spring, solved exactly so any frame rate is stable
function springTo(state, target, w, dt) {
  const e = Math.exp(-w * dt);
  for (let i = 0; i < target.length; i++) {
    const d = state.x[i] - target[i];
    const c = state.v[i] + w * d;
    state.x[i] = target[i] + (d + c * dt) * e;
    state.v[i] = (state.v[i] - w * c * dt) * e;
  }
  return state.x;
}
const spring = x => ({ x: x.slice(), v: x.map(() => 0) });

// Two-bone IK: root a, target t, bone lengths, bend-direction hint
function twoBone(a, t, l1, l2, pole) {
  let d = sub(t, a);
  const dist = clamp(len(d), Math.abs(l1 - l2) + 1e-3, l1 + l2 - 1e-4);
  const dir = norm(d);
  const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
  let perp = sub(pole, mul(dir, dot(pole, dir)));
  if (len(perp) < 1e-6) perp = sub([0, 0, 1], mul(dir, dir[2]));
  perp = norm(perp);
  const mid = add(madd(a, dir, l1 * cosA), mul(perp, l1 * Math.sqrt(1 - cosA * cosA)));
  return { mid, end: madd(a, dir, dist), reach: len(d) / (l1 + l2), bend: perp };
}

// ---------- bodies ----------
const BODY = {
  leader: {
    name: 'leader', hipW: 0.088, thigh: 0.455, shin: 0.435, ankleH: 0.078, ball: 0.15, toe: 0.062, footW: 0.1,
    pelvisUp: 0.072, pelvisBack: 0.05, lumbar: 0.21, thorax: 0.26, neck: 0.11, head: 0.2,
    shoulderW: 0.185, upperArm: 0.3, forearm: 0.255, palm: 0.092, finger: [0.046, 0.028, 0.022], thumb: [0.045, 0.034, 0.027],
  },
  follower: {
    name: 'follower', hipW: 0.09, thigh: 0.41, shin: 0.395, ankleH: 0.07, ball: 0.135, toe: 0.056, footW: 0.088,
    pelvisUp: 0.068, pelvisBack: 0.048, lumbar: 0.19, thorax: 0.235, neck: 0.1, head: 0.185,
    shoulderW: 0.165, upperArm: 0.275, forearm: 0.235, palm: 0.084, finger: [0.042, 0.025, 0.02], thumb: [0.04, 0.03, 0.024],
  },
};

// ---------- moves ----------
// Steps: { k: count, foot, fwd, side, turn, replace, spin, w: width }
//   fwd/side: where the foot lands, relative to standing beside the other foot
//   turn: degrees the body pivots on the other foot while stepping (+ is left)
//   spin: degrees the body pivots on this foot after it lands, before the next step
// Holds: { lh, fh, keys: [[count, place], ...] } leader hand to follower hand
// Free hands: { leader: { R: [[count, pose]] }, follower: { L: [[count, pose]] } }
// Counts run 1-8 (or 1-16); 9 is the next move's 1.
const LOW = [[1, 'low'], [9, 'low']];

const MOVES = {
  basic: {
    name: 'Basic', counts: 8, gap: 0.85,
    leader: [{ k: 1, foot: 'L', fwd: 0.21 }, { k: 2, foot: 'R', replace: true }, { k: 3, foot: 'L', fwd: 0, close: true },
      { k: 5, foot: 'R', fwd: -0.21 }, { k: 6, foot: 'L', replace: true }, { k: 7, foot: 'R', fwd: 0, close: true }],
    follower: [{ k: 1, foot: 'R', fwd: -0.21 }, { k: 2, foot: 'L', replace: true }, { k: 3, foot: 'R', fwd: 0, close: true },
      { k: 5, foot: 'L', fwd: 0.21 }, { k: 6, foot: 'R', replace: true }, { k: 7, foot: 'L', fwd: 0, close: true }],
    holds: [{ lh: 'L', fh: 'R', keys: LOW }],
  },
  crossBody: {
    name: 'Cross Body Lead', counts: 8, gap: 0.85,
    leader: [{ k: 1, foot: 'L', fwd: 0.2 }, { k: 2, foot: 'R', replace: true },
      { k: 3, foot: 'L', turn: 90, fwd: -0.02 }, { k: 5, foot: 'R', fwd: -0.1 },
      { k: 6, foot: 'L', turn: 35, fwd: 0.02 }, { k: 7, foot: 'R', turn: 55, fwd: 0, close: true }],
    follower: [{ k: 1, foot: 'R', fwd: -0.2 }, { k: 2, foot: 'L', replace: true },
      { k: 3, foot: 'R', fwd: 0.3, side: 0.3 }, { k: 5, foot: 'L', fwd: 0.36, side: -0.1 },
      { k: 6, foot: 'R', fwd: 0.32, side: -0.1, spin: 180 }, { k: 7, foot: 'L', fwd: -0.12, close: true }],
    steer: 6, steerLeader: 7,
    holds: [{ lh: 'L', fh: 'R', keys: [[1, 'low'], [3, 'low'], [5, 'lead'], [6, 'lead'], [7.3, 'low'], [9, 'low']] }],
    free: {
      leader: { R: [[1, 'rest'], [4.4, 'rest'], [5, 'back'], [5.6, 'back'], [6.1, 'rest']] },
      follower: { L: [[1, 'style'], [4, 'style'], [4.7, 'tuck'], [6.5, 'tuck'], [7.3, 'style']] },
    },
  },
  outsideTurn: {
    name: 'Outside Turn', counts: 8, gap: 0.85,
    leader: [{ k: 1, foot: 'L', fwd: 0.2 }, { k: 2, foot: 'R', replace: true }, { k: 3, foot: 'L', fwd: 0, close: true },
      { k: 5, foot: 'R', fwd: 0 }, { k: 6, foot: 'L', replace: true }, { k: 7, foot: 'R', fwd: 0, close: true }],
    follower: [{ k: 1, foot: 'R', fwd: -0.2 }, { k: 2, foot: 'L', replace: true }, { k: 3, foot: 'R', fwd: 0, close: true },
      { k: 5, foot: 'L', fwd: 0.26, spin: -270 }, { k: 6, foot: 'R', fwd: 0, w: 0.12, spin: -90 }, { k: 7, foot: 'L', fwd: 0, close: true }],
    steer: 6,
    holds: [{ lh: 'L', fh: 'R', keys: [[1, 'low'], [3.5, 'low'], [5.1, 'over'], [6.8, 'over'], [7.7, 'low'], [9, 'low']] }],
    free: { follower: { L: [[1, 'style'], [4.6, 'style'], [5.1, 'tuck'], [6.8, 'tuck'], [7.6, 'style']] } },
  },
  insideTurn: {
    name: 'Inside Turn', counts: 8, gap: 0.85,
    leader: [{ k: 1, foot: 'L', fwd: 0.2 }, { k: 2, foot: 'R', replace: true }, { k: 3, foot: 'L', fwd: 0, close: true },
      { k: 5, foot: 'R', fwd: 0 }, { k: 6, foot: 'L', replace: true }, { k: 7, foot: 'R', fwd: 0, close: true }],
    follower: [{ k: 1, foot: 'R', fwd: -0.2 }, { k: 2, foot: 'L', replace: true }, { k: 3, foot: 'R', fwd: 0, close: true },
      { k: 5, foot: 'L', fwd: 0.26, spin: 270 }, { k: 6, foot: 'R', fwd: 0, w: 0.12, spin: 90 }, { k: 7, foot: 'L', fwd: 0, close: true }],
    steer: 6,
    holds: [{ lh: 'L', fh: 'R', keys: [[1, 'low'], [3.5, 'low'], [5.1, 'over'], [6.8, 'over'], [7.7, 'low'], [9, 'low']] }],
    free: { follower: { L: [[1, 'style'], [4.6, 'style'], [5.1, 'tuck'], [6.8, 'tuck'], [7.6, 'style']] } },
  },
  hammerlock: {
    name: 'Hammerlock', counts: 16, gap: 0.85,
    phases: [{ at: 7, gap: 0.43, side: 0.09, from: 6 }, { at: 15, gap: 0.85, from: 14 }],
    // he turns his chest into her and leans in to wrap his arm round her
    posture: { leader: [[5, 0, 0], [6.2, 22, 7], [12.8, 22, 7], [13.8, 5, 2], [15, 0, 0]] },
    leader: [{ k: 1, foot: 'L', fwd: 0.18 }, { k: 2, foot: 'R', replace: true }, { k: 3, foot: 'L', fwd: 0, close: true },
      { k: 5, foot: 'R', fwd: -0.06 }, { k: 6, foot: 'L', replace: true }, { k: 7, foot: 'R', fwd: 0.06, close: true },
      { k: 9, foot: 'L', fwd: 0.12 }, { k: 10, foot: 'R', replace: true }, { k: 11, foot: 'L', fwd: 0, close: true },
      { k: 13, foot: 'R', fwd: -0.2 }, { k: 14, foot: 'L', replace: true }, { k: 15, foot: 'R', fwd: -0.16, close: true }],
    follower: [{ k: 1, foot: 'R', fwd: -0.18 }, { k: 2, foot: 'L', replace: true }, { k: 3, foot: 'R', fwd: 0, close: true },
      { k: 5, foot: 'L', fwd: 0.2, spin: 270 }, { k: 6, foot: 'R', fwd: 0, w: 0.12, spin: 90 }, { k: 7, foot: 'L', fwd: 0, close: true },
      { k: 9, foot: 'R', fwd: -0.12 }, { k: 10, foot: 'L', replace: true }, { k: 11, foot: 'R', fwd: 0, close: true },
      { k: 13, foot: 'L', fwd: -0.06, spin: -270 }, { k: 14, foot: 'R', fwd: 0, w: 0.12, spin: -90 }, { k: 15, foot: 'L', fwd: -0.14, close: true }],
    holds: [
      { lh: 'L', fh: 'R', keys: [[1, 'low'], [3.4, 'low'], [4.6, 'lowNear'], [5.55, 'lowNear']] },
      { lh: 'R', fh: 'R', keys: [[5.55, 'fBack'], [12.9, 'fBack'], [13.3, 'fBackR'], [13.6, 'fRightHigh'], [13.95, 'over'], [14.75, 'over'], [15.4, 'low']] },
      { lh: 'L', fh: 'L', keys: [[7.3, 'cross'], [12.5, 'cross']] },
      { lh: 'L', fh: 'R', keys: [[15.25, 'low'], [17, 'low']] },
    ],
    free: {
      follower: { L: [[1, 'style'], [4.6, 'style'], [5.1, 'tuck'], [6.9, 'tuck'], [7.3, 'style'], [12.6, 'style'], [13.1, 'tuck'], [14.8, 'tuck'], [15.6, 'style']] },
      leader: { L: [[5.3, 'side'], [7, 'side'], [12.6, 'side'], [15, 'side'], [15.6, 'rest']] },
    },
  },
};

// ---------- building a move's timeline ----------
// A dancer's state between moves: both feet (floor point under the ankle, and yaw),
// body yaw, and which foot carries the weight.
function cloneState(s) {
  return { L: { p: s.L.p.slice(), yaw: s.L.yaw }, R: { p: s.R.p.slice(), yaw: s.R.yaw }, yaw: s.yaw, weight: s.weight };
}

const TOE_OUT = 6 * RAD;

// Turns a move's step list into timed events for one dancer.
// t0 is the beat of the move's count 1. `steer` ({ dp, dyaw, from }) bends the
// later steps so the dancer ends up where the couple needs them.
function planSteps(body, start, steps, t0, steer) {
  const st = cloneState(start);
  const feet = { L: [], R: [] };      // foot events: step / pivot / tuck, each with from/to states
  const yawKeys = [];                  // body rotations { t0, t1, from, to }
  const weights = [];                  // { t, a, b, foot }
  const width = body.hipW * 2;
  const other = f => (f === 'L' ? 'R' : 'L');
  const side = (f, yaw) => (f === 'L' ? leftOf(yaw) : mul(leftOf(yaw), -1));
  let lastWeightAway = { L: -Infinity, R: -Infinity };
  // Steering: each phase's moving steps (counts from..to) share out a correction, so
  // the dancer arrives exactly where they should. Each foot carries the share it has had.
  const phases = (Array.isArray(steer) ? steer : steer ? [steer] : []).map(p => ({
    ...p, steps: steps.filter(s => !s.replace && s.k >= p.from && s.k <= (p.to || 99)), applied: { L: 0, R: 0 }, yawApplied: 0,
  }));
  const states = {};

  steps.forEach((s, i) => {
    const t = t0 + s.k - 1;
    const f = s.foot, o = other(f);
    if (s.replace) {
      weights.push({ t, a: 0.3, b: 0.12, foot: f });
      lastWeightAway[o] = t;
      st.weight = f;
      states[s.k] = cloneState(st);
      return;
    }
    const prevT = i > 0 ? t0 + steps[i - 1].k - 1 : t - 1;
    let tLift = Math.max(t - 0.62, lastWeightAway[f] + 0.12, prevT + 0.12);
    // A tucked foot (after a spin) is already off the floor
    const prevEvent = feet[f][feet[f].length - 1];
    if (prevEvent && prevEvent.type === 'tuck' && prevEvent.t1 > tLift - 0.01) tLift = prevEvent.t1;
    const tLand = t - 0.02;
    // Pivot on the other foot while stepping
    if (s.turn) {
      const from = st.yaw, to = st.yaw + s.turn * RAD;
      yawKeys.push({ t0: tLift, t1: tLand, from, to });
      const pv = { p: st[o].p.slice(), yaw: st[o].yaw };
      const ball = madd(st[o].p, fwdOf(st[o].yaw), body.ball);
      st[o].yaw += s.turn * RAD;
      st[o].p = madd(ball, fwdOf(st[o].yaw), -body.ball);
      feet[o].push({ type: 'pivot', t0: tLift, t1: tLand, from: pv, to: { p: st[o].p.slice(), yaw: st[o].yaw }, ball });
      st.yaw = to;
    }
    const shares = phases.map(p => (p.steps.indexOf(s) >= 0 ? (p.steps.indexOf(s) + 1) / p.steps.length : 0));
    phases.forEach((p, j) => {
      if (shares[j] && Math.abs(p.dyaw) > 1e-4) {
        const dy = p.dyaw * (shares[j] - p.yawApplied);
        yawKeys.push({ t0: tLift, t1: tLand, from: st.yaw, to: st.yaw + dy });
        st.yaw += dy;
        p.yawApplied = shares[j];
      }
    });
    let target = madd(madd(st[o].p, side(f, st.yaw), (s.w || width) + (s.side || 0)), fwdOf(st.yaw), s.fwd || 0);
    phases.forEach((p, j) => {
      if (!shares[j]) return;
      target = madd(target, p.dp, shares[j] - p.applied[o]);
      p.applied[f] = shares[j];
    });
    const from = prevEvent && prevEvent.type === 'tuck' ? prevEvent.end : { p: st[f].p.slice(), yaw: st[f].yaw };
    const toYaw = st.yaw + (f === 'L' ? TOE_OUT : -TOE_OUT);
    feet[f].push({ type: 'step', t0: tLift, t1: tLand, from, to: { p: target, yaw: toYaw } });
    st[f] = { p: target, yaw: toYaw };
    // Traveling steps carry the body along as the foot swings, like walking;
    // steps in place change weight on the beat
    const travel = Math.min(1, Math.hypot(target[0] - st[f].p[0], target[2] - st[f].p[2]) / 0.45);
    weights.push({ t, a: 0.16 + 0.34 * travel, b: 0.24 - 0.06 * travel, foot: f });
    lastWeightAway[o] = t;
    st.weight = f;
    // Spin on the landed foot until shortly before the next step
    if (s.spin) {
      const next = steps[i + 1];
      const tEnd = next ? t0 + next.k - 1 - 0.18 : t + 0.8;
      const ts = t + 0.06;
      const from = st.yaw, to = st.yaw + s.spin * RAD;
      yawKeys.push({ t0: ts, t1: tEnd, from, to, spin: true });
      const pv = { p: st[f].p.slice(), yaw: st[f].yaw };
      // pivot about the ball of the foot
      const ball = madd(st[f].p, fwdOf(st[f].yaw), body.ball);
      const newYaw = st[f].yaw + s.spin * RAD;
      st[f] = { p: madd(ball, fwdOf(newYaw), -body.ball), yaw: newYaw };
      feet[f].push({ type: 'pivot', t0: ts, t1: tEnd, from: pv, to: { p: st[f].p.slice(), yaw: newYaw }, ball, spin: true });
      // the other foot lifts and turns with the body
      const offset = (yaw) => madd(madd(ball, side(o, yaw), width * 0.55), fwdOf(yaw), -body.ball * 0.75);
      const tuckEnd = { p: offset(to), yaw: to + (o === 'L' ? TOE_OUT : -TOE_OUT) };
      feet[o].push({ type: 'tuck', t0: ts - 0.05, t1: tEnd, ball, from: { p: st[o].p.slice(), yaw: st[o].yaw }, yawFrom: from, yawTo: to, offset, end: tuckEnd });
      st[o] = { p: tuckEnd.p.slice(), yaw: tuckEnd.yaw };
      st.yaw = to;
    }
    states[s.k] = cloneState(st);
  });
  return { feet, yawKeys, weights, end: st, states };
}

// ---------- reading a timeline ----------
function eventAt(list, t) {
  let ev = null;
  for (const e of list) { if (e.t0 <= t) ev = e; else break; }
  return ev;
}

const angLerp = (a, b, t) => a + (b - a) * t;

// Where a foot is: { p (floor point under ankle), yaw, lift (height), pitch (heel up), planted }
function footAt(tl, foot, t, body, weightOn) {
  const ev = eventAt(tl.feet[foot], t);
  const base = ev ? ev.to : tl.start[foot];
  if (!ev || t >= ev.t1) {
    const unweighted = 1 - weightOn;
    return { p: base.p.slice(), yaw: base.yaw, lift: 0, pitch: unweighted * 22 * RAD, planted: true };
  }
  const u = clamp((t - ev.t0) / (ev.t1 - ev.t0), 0, 1);
  if (ev.type === 'pivot') {
    const e = ev.spin ? smoother(u) : smooth(u);
    const yaw = angLerp(ev.from.yaw, ev.to.yaw, e);
    const ball = ev.ball || madd(ev.from.p, fwdOf(ev.from.yaw), body.ball);
    return { p: madd(ball, fwdOf(yaw), -body.ball), yaw, lift: 0, pitch: (ev.spin ? 14 : 8) * RAD, planted: true };
  }
  if (ev.type === 'tuck') {
    const yaw = angLerp(ev.yawFrom, ev.yawTo, smoother(u));
    const raise = smooth(u * 4);
    const target = ev.offset(yaw);
    const p = lerp(ev.from.p, target, smooth(u * 3));
    return { p, yaw: yaw + (foot === 'L' ? TOE_OUT : -TOE_OUT), lift: 0.06 * raise, pitch: 35 * RAD, planted: false };
  }
  // step: roll off the heel, swing low and land on the ball
  const s = smoother(u);
  const p = lerp(ev.from.p, ev.to.p, s);
  const dist = Math.hypot(ev.to.p[0] - ev.from.p[0], ev.to.p[2] - ev.from.p[2]);
  const lift = (0.018 + Math.min(0.045, dist * 0.18)) * Math.sin(Math.PI * u);
  const swingPitch = (u < 0.25 ? lerpN(22, 30, u / 0.25) : lerpN(30, 6, (u - 0.25) / 0.75)) * RAD;
  const pitch = lerpN(swingPitch, (1 - weightOn) * 22 * RAD, smooth((u - 0.8) / 0.2));
  return { p, yaw: angLerp(ev.from.yaw, ev.to.yaw, s), lift, pitch, planted: false };
}

function yawAt(tl, t) {
  let yaw = tl.start.yaw;
  for (const k of tl.yawKeys) {
    if (k.t0 > t) break;
    const u = clamp((t - k.t0) / (k.t1 - k.t0), 0, 1);
    yaw = angLerp(k.from, k.to, k.spin ? smoother(u) : smooth(u));
  }
  return yaw;
}

function weightRAt(tl, t) {
  let w = tl.start.weight === 'R' ? 1 : 0;
  for (const e of tl.weights) {
    if (e.t - e.a > t) break;
    const target = e.foot === 'R' ? 1 : 0;
    w = lerpN(w, target, smooth((t - (e.t - e.a)) / (e.a + e.b)));
  }
  return w;
}

// Is the dancer mid-spin, and how far through?
function spinAt(tl, t) {
  for (const k of tl.yawKeys) {
    if (!k.spin) continue;
    if (t >= k.t0 - 0.25 && t <= k.t1 + 0.2) return { k, u: clamp((t - k.t0) / (k.t1 - k.t0), 0, 1) };
  }
  return null;
}

// ---------- the dance ----------
class Dance {
  constructor() {
    this.bodies = { leader: BODY.leader, follower: BODY.follower };
    const L = BODY.leader, F = BODY.follower;
    const leaderStart = { L: { p: [L.hipW, 0, -0.42], yaw: TOE_OUT }, R: { p: [-L.hipW, 0, -0.42], yaw: -TOE_OUT }, yaw: 0, weight: 'R' };
    const followerStart = { L: { p: [-F.hipW, 0, 0.42], yaw: Math.PI + TOE_OUT }, R: { p: [F.hipW, 0, 0.42], yaw: Math.PI - TOE_OUT }, yaw: Math.PI, weight: 'L' };
    this.tl = {
      leader: { start: cloneState(leaderStart), feet: { L: [], R: [] }, yawKeys: [], weights: [] },
      follower: { start: cloneState(followerStart), feet: { L: [], R: [] }, yawKeys: [], weights: [] },
    };
    this.end = { leader: cloneState(leaderStart), follower: cloneState(followerStart) };
    this.instances = [];     // { move, key, t0, t1 }
    this.plannedUntil = 0;   // beat where the last planned move ends
    this.queue = [];
    this.state = { leader: null, follower: null };
  }

  // Adds the next move to the timeline, starting at the end of what's planned
  plan(key) {
    const move = MOVES[key];
    const t0 = this.plannedUntil;
    // Plan freely first. Then the leader's last steps close the door back onto the slot
    // (the line the couple was dancing on), and the follower's are steered so she
    // finishes facing him, the move's gap away.
    const center = st => lerp(st.L.p, st.R.p, 0.5);
    const sL = center(this.end.leader), sF = center(this.end.follower);
    let axis = sub(sF, sL); axis[1] = 0; axis = norm(axis);
    const dryL = planSteps(BODY.leader, this.end.leader, move.leader, t0, null);
    const lcDry = center(dryL.end);
    const onSlot = madd(sL, axis, dot(sub(lcDry, sL), axis));
    const slotYaw = Math.atan2(axis[0], axis[2]);
    const yawHome = Math.abs(wrap(slotYaw - dryL.end.yaw)) < Math.PI / 2 ? slotYaw : slotYaw + Math.PI;
    const lead = move.steerLeader
      ? planSteps(BODY.leader, this.end.leader, move.leader, t0, { dp: sub(onSlot, lcDry), dyaw: wrap(yawHome - dryL.end.yaw), from: move.steerLeader })
      : dryL;
    // Each phase: by count `at` she faces him `gap` away, steered over her steps from `from`
    const lastK = move.follower[move.follower.length - 1].k;
    const phaseList = move.phases || [{ at: lastK, gap: move.gap, from: move.steer || 5 }];
    const steers = [];
    const stateAt = (plan, k) => {
      let st = null;
      for (const c of Object.keys(plan.states).map(Number).sort((a, b) => a - b)) if (c <= k) st = plan.states[c];
      return st;
    };
    for (const ph of phaseList) {
      const dryF = planSteps(BODY.follower, this.end.follower, move.follower, t0, steers);
      const ls = stateAt(lead, ph.at), fs = stateAt(dryF, ph.at);
      const lc = lerp(ls.L.p, ls.R.p, 0.5), fc = lerp(fs.L.p, fs.R.p, 0.5);
      const dp = sub(madd(madd(lc, fwdOf(ls.yaw), ph.gap), leftOf(ls.yaw), -(ph.side || 0)), fc); dp[1] = 0;
      const dyaw = wrap(ls.yaw + Math.PI - fs.yaw);
      steers.push({ dp, dyaw, from: ph.from, to: ph.at });
      if (globalThis.__steerLog) globalThis.__steerLog.push({ key, dp, dyaw, yaw: fs.yaw });
    }
    const follow = planSteps(BODY.follower, this.end.follower, move.follower, t0, steers);
    for (const [role, plan] of [['leader', lead], ['follower', follow]]) {
      const tl = this.tl[role];
      tl.feet.L.push(...plan.feet.L);
      tl.feet.R.push(...plan.feet.R);
      tl.yawKeys.push(...plan.yawKeys);
      tl.weights.push(...plan.weights);
      // keep only recent history
      for (const f of ['L', 'R']) while (tl.feet[f].length > 40) tl.feet[f].shift();
      while (tl.yawKeys.length > 60) tl.yawKeys.shift();
      while (tl.weights.length > 80) tl.weights.shift();
      this.end[role] = plan.end;
    }
    const inst = { key, move, t0, t1: t0 + move.counts };
    this.instances.push(inst);
    while (this.instances.length > 8) this.instances.shift();
    this.plannedUntil = inst.t1;
    return inst;
  }

  instanceAt(t) {
    let found = null;
    for (const m of this.instances) if (m.t0 <= t + 1e-9) found = m;
    return found;
  }

  // Keeps the timeline planned ahead of the music; moves wait for the next phrase
  ensure(t) {
    while (this.plannedUntil < t + 1.5) this.plan(this.queue.length ? this.queue.shift() : 'basic');
  }

  // Everything about both dancers at beat t
  update(t, dt) {
    this.ensure(t);
    const inst = this.instanceAt(t);
    const k = inst ? t - inst.t0 + 1 : 1;
    const out = {};
    for (const role of ['leader', 'follower']) out[role] = this.lower(role, t, dt);
    for (const role of ['leader', 'follower']) this.upper(role, out[role], out[role === 'leader' ? 'follower' : 'leader'], t, dt);
    this.hands(out, inst, k, t, dt);
    for (const role of ['leader', 'follower']) this.arms(role, out[role], dt);
    out.count = ((Math.floor(t) % 8) + 8) % 8 + 1;
    out.move = inst ? inst.move.name : 'Basic';
    out.moveKey = inst ? inst.key : 'basic';
    out.k = k;
    return out;
  }

  // ---- legs, pelvis ----
  lower(role, t, dt) {
    const body = this.bodies[role];
    const tl = this.tl[role];
    let s = this.state[role];
    const wR = weightRAt(tl, t);
    const fL = footAt(tl, 'L', t, body, 1 - wR);
    const fR = footAt(tl, 'R', t, body, wR);
    const yaw = yawAt(tl, t);
    const spin = spinAt(tl, t);

    const ankleOf = f => {
      // rotate the foot about its ball by the heel lift
      const fwd = fwdOf(f.yaw);
      const ball = add(madd(f.p, fwd, body.ball), [0, f.lift, 0]);
      const back = add(mul(fwd, -body.ball * Math.cos(f.pitch)), [0, body.ball * Math.sin(f.pitch), 0]);
      const up = add(mul(fwd, -body.ankleH * Math.sin(f.pitch)), [0, body.ankleH * Math.cos(f.pitch), 0]);
      return { ankle: add(add(ball, back), up), ball, fwd };
    };
    const aL = ankleOf(fL), aR = ankleOf(fR);

    // The pelvis rides over the weighted foot: over the arch normally, and right
    // over the ball while spinning on it, so the body turns in place
    const over = (f, sp) => madd(f.p, fwdOf(f.yaw), body.ball * (sp ? 1 : 0.4));
    const pivotFoot = spin ? (wR > 0.5 ? 'R' : 'L') : null;
    const support = lerp(over(fL, pivotFoot === 'L'), over(fR, pivotFoot === 'R'), wR);
    const target = madd(support, fwdOf(yaw), 0.015);
    if (!s) {
      s = this.state[role] = {
        pelvis: spring([target[0], target[2]]), yaw: spring([yaw]), chestYaw: spring([yaw]), headYaw: spring([yaw]), headPitch: spring([0]),
        hand: {}, free: {}, cuban: spring([0, 0]), height: spring([0]),
      };
    }
    const pxz = springTo(s.pelvis, [target[0], target[2]], spin ? 26 : 15, dt);
    // keep yaw continuous through the spring
    const yawS = springTo(s.yaw, [yaw], spin ? 40 : 16, dt)[0];
    // Cuban motion: the standing hip settles out and up, the free knee bends
    const lean = (wR - 0.5) * 2;
    const cub = springTo(s.cuban, [lean, 0], 11, dt);
    const pelvisYaw = yawS - cub[0] * 6 * RAD * (spin ? 0.2 : 1);
    const roll = cub[0] * 5 * RAD * (spin ? 0.3 : 1);
    const pitch = 4 * RAD;

    // pelvis frame
    let fw = fwdOf(pelvisYaw), lf = leftOf(pelvisYaw);
    lf = rotAxis(lf, fw, -roll);
    let up = norm(cross(fw, lf));
    fw = rotAxis(fw, lf, pitch);
    up = rotAxis(up, lf, pitch);

    // Height: as tall as the legs allow, with soft knees
    const L = body.thigh + body.shin;
    const hipOff = (sgn) => mul(lf, sgn * body.hipW);
    let yMax = Infinity;
    for (const [a, sgn, f] of [[aL, 1, fL], [aR, -1, fR]]) {
      const h = add([pxz[0], 0, pxz[1]], hipOff(sgn));
      const dx = h[0] - a.ankle[0], dz = h[2] - a.ankle[2];
      const reach = L * (f.planted ? 0.985 : 0.99);
      const lim = a.ankle[1] + Math.sqrt(Math.max(0.05, reach * reach - dx * dx - dz * dz)) - h[1];
      // the swinging leg doesn't hold the body down
      yMax = Math.min(yMax, lim);
    }
    const stand = body.ankleH + L * 0.972;
    if (!s.heightInit) { s.height.x[0] = Math.min(stand, yMax); s.heightInit = true; }
    const y = Math.min(springTo(s.height, [Math.min(stand, yMax)], 22, dt)[0], yMax + 0.004);
    const pelvis = [pxz[0], y, pxz[1]];

    const hipL = add(pelvis, hipOff(1)), hipR = add(pelvis, hipOff(-1));
    const kneeOut = (f, sgn) => norm(add(fwdOf(f.yaw), mul(leftOf(f.yaw), sgn * 0.12)));
    const legL = twoBone(hipL, aL.ankle, body.thigh, body.shin, kneeOut(fL, 1));
    const legR = twoBone(hipR, aR.ankle, body.thigh, body.shin, kneeOut(fR, -1));

    return {
      role, body, t, yaw: yawS, pelvisYaw, wR, spin, roll,
      pelvis, pelvisFrame: { o: pelvis, x: lf, y: up, z: fw },
      feet: { L: fL, R: fR }, ankles: { L: aL, R: aR },
      legs: { L: { hip: hipL, knee: legL.mid, ankle: legL.end, reach: legL.reach }, R: { hip: hipR, knee: legR.mid, ankle: legR.end, reach: legR.reach } },
    };
  }

  // Posture from the current move: [count, twist°, lean°] keys, blended
  posture(role, t) {
    let twist = 0, lean = 0;
    for (const m of this.instances) {
      const keys = m.move.posture && m.move.posture[role];
      if (!keys || t < m.t0 || t > m.t1) continue;
      const ks = keys.map(([c, a, b]) => [m.t0 + c - 1, a, b]);
      if (t <= ks[0][0]) { twist = ks[0][1]; lean = ks[0][2]; continue; }
      let i = 0;
      while (i < ks.length - 1 && ks[i + 1][0] <= t) i++;
      if (i >= ks.length - 1) { twist = ks[i][1]; lean = ks[i][2]; continue; }
      const u = smooth((t - ks[i][0]) / (ks[i + 1][0] - ks[i][0]));

// Mirror a left-side geometry into its right-side twin (flip x, keep the winding outward)
function mirror(geo) {
  const g = (geo.index ? geo.toNonIndexed() : geo.clone());
  g.scale(-1, 1, 1);
  for (const at of Object.values(g.attributes)) {
    const n = at.itemSize, a = at.array;
    for (let i = 0; i < at.count; i += 3) for (let k = 0; k < n; k++) {
      const t = a[(i + 1) * n + k]; a[(i + 1) * n + k] = a[(i + 2) * n + k]; a[(i + 2) * n + k] = t;
    }
  }
  return g;
}

// ---------- skull ----------
// Head frame: origin on top of the atlas, so the face hangs forward and the jaw below.
function skull(s) {
  const cr = new THREE.SphereGeometry(1, 52, 38);
  const p = cr.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (y < -0.35) y = -0.35 + (y + 0.35) * 0.5;                // flatter base
    if (z > 0.15 && y < 0.3) x *= 1 - 0.12 * (z - 0.15);       // temples narrow toward the face
    const zs = z < 0 ? 0.1 : 0.092 - 0.01 * Math.max(0, y);      // forehead slopes back, occiput fuller
    p.setXYZ(i, x * 0.07, y * 0.078 + 0.06, z * zs - 0.012);
  }
  cr.computeVertexNormals();
  const parts = [weather(cr, 3)];
  // upper jaw, cheekbones, brow, nose bridge
  parts.push(ball(1, 0, -0.004, 0.056, 0.034, 0.027, 0.03, 20));
  parts.push(tube([[-0.054, 0.054, 0.068], [-0.03, 0.061, 0.083], [0, 0.057, 0.087], [0.03, 0.061, 0.083], [0.054, 0.054, 0.068]], 0.0055, 24, 7));
  parts.push(tube([[0, 0.05, 0.084], [0, 0.036, 0.088], [0, 0.026, 0.091]], 0.0042, 8, 6));
  for (const sx of [-1, 1]) {
    parts.push(ball(1, sx * 0.05, 0.022, 0.062, 0.012, 0.009, 0.011));
    parts.push(tube([[sx * 0.054, 0.02, 0.058], [sx * 0.062, 0.017, 0.03], [sx * 0.065, 0.018, 0.002]], 0.0045, 12, 6));
    parts.push(ball(1, sx * 0.055, -0.006, -0.012, 0.007, 0.012, 0.008)); // mastoid
    // orbit rim: a ring whose outer side sits further back
    const rim = [];
    for (let k = 0; k < 20; k++) {
      const a = k / 20 * Math.PI * 2, c = Math.cos(a);
      rim.push([sx * (0.031 + 0.0195 * c), 0.04 + 0.0175 * Math.sin(a), 0.083 - 0.012 * Math.max(0, c)]);
    }
    parts.push(tube(rim, 0.0045, 40, 6, true));
  }
  // teeth on two arches, the lower set just behind the upper
  for (const [y, r, zc] of [[-0.031, 0.026, 0.06], [-0.041, 0.024, 0.058]]) {
    for (let i = 0; i < 16; i++) {
      const a = -1.25 + 2.5 * i / 15;
      const front = Math.abs(a) < 0.45;
      const g = new THREE.BoxGeometry(front ? 0.0062 : 0.0075, 0.009, front ? 0.0042 : 0.0075, 1, 1, 1);
      g.rotateY(a); g.translate(Math.sin(a) * r, y, zc + Math.cos(a) * r);
      parts.push(weather(g, i));
    }
    const arch = [];
    for (let i = 0; i <= 12; i++) { const a = -1.3 + 2.6 * i / 12; arch.push([Math.sin(a) * (r + 0.001), y + (y > -0.035 ? 0.009 : -0.009), zc + Math.cos(a) * (r + 0.001) - 0.001]); }
    parts.push(tube(arch, 0.0068, 24, 7));
  }
  // lower jaw: up the rami to the joints in front of the ears, round the chin
  const jaw = [[0.052, 0.0, 0.006], [0.05, -0.03, 0.002], [0.047, -0.056, 0.004], [0.04, -0.062, 0.035], [0.025, -0.066, 0.064], [0, -0.07, 0.08]];
  parts.push(tube([...jaw, ...jaw.slice(0, -1).reverse().map(([x, y, z]) => [-x, y, z])], 0.0085, 60, 8));
  parts.push(ball(1, 0, -0.068, 0.079, 0.015, 0.01, 0.008));
  for (const sx of [-1, 1]) parts.push(tube([[sx * 0.046, -0.04, 0.012], [sx * 0.045, -0.02, 0.022], [sx * 0.046, -0.004, 0.03]], 0.005, 8, 6));
  const bone = merge(parts);

    ball(1, -0.031, 0.04, 0.073, 0.017, 0.0155, 0.008, 18), ball(1, 0.031, 0.04, 0.073, 0.017, 0.0155, 0.008, 18),
    ball(1, 0, 0.008, 0.079, 0.0105, 0.015, 0.008, 14),

// ---------- spine ----------
function spine(L, n, r0, r1, kind) {
  const bone = [], disc = [];
  for (let i = 0; i < n; i++) {
    const u = i / Math.max(1, n - 1);
    // the vertebrae get bigger toward the bottom of each segment
    const r = r1 + (r0 - r1) * u;
    const y = L * (n - i - 0.5) / n;
    const h = L / n * 0.7;
    const body = cyl(r, r * 1.04, h, 0, y, 0.004, 0, 0, 14);
    body.scale(1, 1, 0.82);
    bone.push(body);
    disc.push(cyl(r * 0.96, r * 0.96, L / n * 0.3, 0, y - L / n * 0.5, 0.004 * 0.82, 0, 0, 14));
    // the arch behind the body around the spinal cord
    const arch = new THREE.TorusGeometry(r * 0.62, r * 0.18, 6, 12, Math.PI);
    arch.rotateX(-Math.PI / 2); arch.translate(0, y, -r * 0.62);
    bone.push(weather(arch, i));
    // spinous process pointing back (and down in the chest), transverse processes out
    const drop = kind === 't' ? 0.9 : kind === 'l' ? 0.1 : 0.35;
    const len = kind === 'l' ? r * 1.5 : kind === 't' ? r * 2.0 : r * 1.5;
    const dir = [0, -Math.sin(drop), -Math.cos(drop)], st = [0, y, -r * 1.2];
    bone.push(between(st, [st[0] + dir[0] * len, st[1] + dir[1] * len, st[2] + dir[2] * len], [[0, r * 0.3], [0.7, r * 0.22], [1, r * 0.14]], 8, [0.6, 1]));
    const w = kind === 'l' ? r * 2.3 : kind === 't' ? r * 2.0 : r * 1.7;
    bone.push(cyl(r * 0.14, r * 0.2, w * 2, 0, y + (kind === 't' ? r * 0.2 : 0), -r * 0.75, 0, Math.PI / 2, 8));
  }
  return { bone, disc };
}

// ---------- ribcage, sternum, shoulder blades ----------
function thoraxGeo(b, female) {
  const s = b.thorax / 0.26, wk = female ? 0.93 : 1;
  const bones = [], cart = [];
  const W = [0.052, 0.072, 0.088, 0.1, 0.11, 0.118, 0.123, 0.126, 0.126, 0.122, 0.112, 0.1];
  const DROP = [0.03, 0.042, 0.052, 0.062, 0.072, 0.08, 0.088, 0.096, 0.1, 0.098, 0.07, 0.055];
  const zst = y => 0.065 + 0.067 * clamp01((0.235 - y) / 0.16);
  const ends = [];
  for (let i = 0; i < 12; i++) {
    const yv = 0.244 - i * 0.0193, w = W[i], drop = DROP[i];
    const floating = i >= 10, falseRib = i >= 7 && !floating;
    const zb = -0.03 - 0.008 * Math.sin(Math.PI * i / 11);
    const yf = yv - drop;
    let dz, phiEnd;
    if (floating) { dz = 0.085; phiEnd = i === 10 ? 0.64 * Math.PI : 0.5 * Math.PI; }
    else {
      const xend = falseRib ? 0.062 + (i - 7) * 0.017 : 0.027 + i * 0.0055;
      const zf = zst(yf) - 0.012 - (falseRib ? 0.012 : 0);
      const c = Math.sqrt(Math.max(0, 1 - (xend / w) ** 2));
      dz = (zf - zb) / (1 + c);
      phiEnd = Math.PI - Math.asin(Math.min(1, xend / w));
    }
    const zc = zb + dz, phi0 = 0.42;
    const pts = [[0.011, yv + 0.003, -0.006], [0.026, yv + 0.006, -0.024]];
    for (let k = 0; k <= 10; k++) {
      const phi = phi0 + (phiEnd - phi0) * k / 10;
      pts.push([w * Math.sin(phi), yv + 0.006 - drop * Math.pow(k / 10, 1.35), zc - dz * Math.cos(phi)]);
    }
    bones.push(tube(pts, i < 2 ? 0.0062 : 0.0054, 30, 7));
    const end = pts[pts.length - 1];
    ends.push(end);
    if (floating) { bones.push(ball(0.0058, ...end)); continue; }
    if (!falseRib) {
      const ys = yf + 0.004 + i * 0.0045;
      cart.push(tube([end, [(end[0] + 0.013) / 2, (end[1] + ys) / 2 - 0.004, zst(ys) - 0.006], [0.013, ys, zst(ys)]], 0.0048, 10, 6));
    } else {
      // false ribs join the cartilage above them, making the arch under the chest
      const to = i === 7 ? [0.016, 0.088, zst(0.088) - 0.002] : ends[i - 1];
      cart.push(tube([end, [(end[0] + to[0]) / 2 - 0.004, (end[1] + to[1]) / 2 - 0.003, (end[2] + to[2]) / 2 + 0.004], to], 0.0046, 10, 6));
    }
  }
  // sternum: manubrium, body and xiphoid on a line that leans forward going down
  const st = lathe(0.17, [[0, 0.003], [0.08, 0.007], [0.15, 0.009], [0.2, 0.013], [0.55, 0.0145], [0.68, 0.012], [0.74, 0.019], [0.9, 0.024], [0.97, 0.02], [1, 0.006]], 14);
  st.scale(1, 1, 0.38);
  const sp = st.attributes.position;
  for (let i = 0; i < sp.count; i++) { const y = sp.getY(i) + 0.064; sp.setY(i, y); sp.setZ(i, sp.getZ(i) + zst(y)); }
  st.computeVertexNormals();
  const half = merge(bones), halfCart = merge(cart);
  const g = merge([half, mirror(half), st]), gc = merge([halfCart, mirror(halfCart)]);
  g.scale(s * wk, s, s); gc.scale(s * wk, s, s);
  // shoulder blades sit on the back of the ribs, the socket meeting the arm bone
  const J = [b.shoulderW, b.thorax - 0.035, 0.045];
  const S = [0.056 * s, J[1] + 0.022 * s, -0.05 * s], I = [0.086 * s, J[1] - 0.135 * s, -0.05 * s];
  const Lt = [J[0] - 0.04, J[1] - 0.012, -0.012];
  const sc = [];
  sc.push(loft([S, [0.064 * s, J[1] - 0.06 * s, -0.056 * s], I], [Lt, [0.12 * s, J[1] - 0.075 * s, -0.035 * s], I], 12, 6, (u, v) => [0, 0, -0.006 * Math.sin(Math.PI * v) * Math.sin(Math.PI * u)]));
  sc.push(tube([S, [0.064 * s, J[1] - 0.06 * s, -0.056 * s], I], 0.0045, 16, 6));
  sc.push(tube([I, [0.12 * s, J[1] - 0.075 * s, -0.035 * s], Lt, [J[0] - 0.026, J[1], 0.03]], 0.0062, 18, 6));
  sc.push(tube([S, [(S[0] + Lt[0]) / 2, J[1] + 0.012, -0.035], [J[0] - 0.032, J[1] + 0.012, 0.0]], 0.0035, 12, 6));
  // spine of the scapula rising to the acromion over the shoulder
  sc.push(tube([[0.06 * s, J[1] - 0.025 * s, -0.056 * s], [0.11 * s, J[1] + 0.005, -0.052 * s], [J[0] - 0.02, J[1] + 0.026, -0.02], [J[0] - 0.002, J[1] + 0.03, 0.022]], 0.0058, 20, 7));
  sc.push(ball(1, J[0] - 0.002, J[1] + 0.03, 0.026, 0.014, 0.005, 0.016));
  sc.push(ball(1, J[0] - 0.026, J[1], 0.032, 0.009, 0.017, 0.013)); // glenoid
  sc.push(tube([[J[0] - 0.04, J[1] + 0.02, 0.0], [J[0] - 0.042, J[1] + 0.018, 0.03], [J[0] - 0.034, J[1] + 0.01, 0.058]], 0.005, 10, 6)); // coracoid
  const scap = merge(sc);
  return { bone: merge([g, scap, mirror(scap)]), cartilage: gc };
}

// ---------- pelvis ----------
function pelvisGeo(b, female) {
  const sx = b.hipW / 0.088 * (female ? 1.04 : 1), sy = female ? 0.9 : 1;

  if (clock.speed === 1) band.start(clock.beat);
});
$('silent').addEventListener('click', () => startEl.classList.add('gone'));
if (params.has('nostart')) startEl.classList.add('gone');

// ---------- the loop ----------
const center = new THREE.Vector3(0, 0.95, 0), lastCenter = new THREE.Vector3(0, 0.95, 0);
const colL = [], colF = [];
let last = performance.now(), placed = false, frames = 0;
const fixed = params.get('t');           // ?t=beat freezes the dance at a beat (for stills)

function step(now) {
  const real = Math.max(0, Math.min(0.1, (now - last) / 1000));
  last = now;
  band.tick();
  autoPick();
  let dBeat;
  if (fixed !== null) {
    const target = Number(fixed);
    // run up to the requested beat in small steps so springs and cloth settle
    if (!placed) { clock.beat = Math.max(0, target - 4); }
    dBeat = Math.min(1 / 60 * bpm / 60, target - clock.beat);
    clock.beat += dBeat;
  } else dBeat = advance(real);
  const secs = dBeat * 60 / bpm;
  const out = dance.update(clock.beat, Math.max(1e-4, secs));
  const fl = boneFrames(out.leader), ff = boneFrames(out.follower);
  poseSkeleton(lead, fl);
  poseSkeleton(follow, ff);

  // clothes
  colL.length = 0; colF.length = 0;
  colliders(out.leader, fl, true, colL); colliders(out.follower, ff, false, colL);
  colliders(out.follower, ff, true, colF); colliders(out.leader, fl, false, colF);
  if (!placed) {
    skirt.cloth.place(ff.pelvis); shorts.cloth.place(fl.pelvis);
    // let them settle onto the bones before anyone sees them
    for (let i = 0; i < 90; i++) { skirt.cloth.step(1 / 60, ff.pelvis, Float32Array.from(colF)); shorts.cloth.step(1 / 60, fl.pelvis, Float32Array.from(colL)); }
    placed = true;
  }
  const simDt = Math.min(secs, 1 / 30);
  skirt.cloth.step(simDt, ff.pelvis, Float32Array.from(colF));
  shorts.cloth.step(simDt, fl.pelvis, Float32Array.from(colL));
  for (const g of [skirt, shorts]) { g.geo.attributes.position.needsUpdate = true; g.geo.computeVertexNormals(); }
  skirt.band.matrix.copy(frameMatrix(ff.pelvis)); skirt.band.matrixWorldNeedsUpdate = true;
  shorts.band.matrix.copy(frameMatrix(fl.pelvis)); shorts.band.matrixWorldNeedsUpdate = true;

  // camera follows the couple
  const L = out.leader.pelvis, F = out.follower.pelvis;
  center.set((L[0] + F[0]) / 2, 0.92, (L[2] + F[2]) / 2);
  const delta = center.clone().sub(lastCenter).multiplyScalar(0.06);
  lastCenter.add(delta);
  controls.target.add(delta);
  camera.position.add(delta);
  if (flying) {
    const axis = new THREE.Vector3(F[0] - L[0], 0, F[2] - L[2]).normalize();
    const side = new THREE.Vector3(axis.z, 0, -axis.x);
    const want = view === 'Side' ? lastCenter.clone().addScaledVector(side, 4.3).add(new THREE.Vector3(0, 0.35, 0)) : lastCenter.clone().add(new THREE.Vector3(0.01, 5.2, 0.6));
    camera.position.lerp(want, 0.05);
    if (camera.position.distanceTo(want) < 0.02) flying = 0;
  }
  key.position.set(lastCenter.x + 2.5, 5.5, lastCenter.z + 3);
  key.target.position.copy(lastCenter);
  pool.position.set(lastCenter.x, 0.002, lastCenter.z);
  controls.update();

  updateHud(out);
  renderer.render(scene, camera);
  frames++;
  requestAnimationFrame(step);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  // pull back on tall narrow screens so both dancers fit
  camera.fov = camera.aspect < 0.8 ? 50 : 32;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
renderQueue();
requestAnimationFrame(step);
window.__salsa = { dance, clock, band, renderer, get frames() { return frames; }, queueMove, setView, setSlow };

return {  };
})();
</script>
