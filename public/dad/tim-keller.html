<style>
/* Layout: a study notebook. Sticky search bar on top, the study outline in a left margin column, one reading column for the open page. */
:root {
  --paper: #EEF1EC;
  --surface: #FFFFFF;
  --sunk: #E3E8E2;
  --ink: #16202A;
  --muted: #55606B;
  --line: #D2D9D2;
  --accent: #1D4868;
  --accent-ink: #FFFFFF;
  --accent-soft: #DAE5EE;
  --mark: #F5E27C;
  --mark-ink: #16202A;
  --danger: #9A3324;
  --ok: #2C6A48;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10161B; --surface: #172028; --sunk: #0C1115; --ink: #E6EBEF; --muted: #9AA7B3; --line: #2A3540;
    --accent: #9DC1E4; --accent-ink: #0D1A26; --accent-soft: #1E3347; --mark: #5E5420; --mark-ink: #FFF7D1;
    --danger: #E38B7C; --ok: #86C9A2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10161B; --surface: #172028; --sunk: #0C1115; --ink: #E6EBEF; --muted: #9AA7B3; --line: #2A3540;
  --accent: #9DC1E4; --accent-ink: #0D1A26; --accent-soft: #1E3347; --mark: #5E5420; --mark-ink: #FFF7D1;
  --danger: #E38B7C; --ok: #86C9A2; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--read); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
button, input, select, textarea { font: inherit; color: inherit; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--read); font-size: 1.35rem; font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand span { font-weight: 400; font-style: italic; color: var(--muted); }
.searchbar { flex: 1 1 360px; display: flex; gap: 8px; min-width: 0; }
.searchbar input { flex: 1; min-width: 0; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 1rem; }
.searchbar input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.study-link { display: none; font-weight: 600; text-decoration: none; white-space: nowrap; }

/* Shell */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.outline { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px; }
main { min-width: 0; max-width: 780px; display: grid; gap: 28px; align-content: start; }

/* Outline */
.ol-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.ol-head h2 { font-size: 1.2rem; }
.ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ol a { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 2px 8px; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.ol a:hover { background: var(--sunk); }
.ol a[aria-current="page"] { background: var(--accent-soft); }
.ol .n { font-family: var(--read); font-weight: 600; font-size: 1.05rem; color: var(--accent); font-variant-numeric: tabular-nums; text-align: right; }
.ol .t { font-weight: 600; font-size: .95rem; overflow-wrap: anywhere; }
.ol .sub { grid-column: 2; font-size: .82rem; color: var(--muted); }
.ol .pg .n { font-family: var(--ui); font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.ol .pg .t { font-weight: 500; font-style: italic; font-family: var(--read); font-size: 1rem; }
.ol-add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.ol-keep { display: grid; gap: 8px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
.ol-keep p { margin: 0; }
.ol-keep .ol-add { margin-top: 0; }
.ol-empty { color: var(--muted); font-size: .92rem; display: grid; gap: 8px; padding: 12px; border: 1.5px dashed var(--line); border-radius: var(--r); }
.ol-empty ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font-weight: 600; font-size: .95rem; cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 5px 12px; font-size: .85rem; }
.btn.danger { border-color: var(--danger); background: transparent; color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.btn[disabled] { opacity: .5; cursor: default; }
.field { display: grid; gap: 4px; }
.field > span { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .inline-input { padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus, .inline-input:focus, .title-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; }
.writing { font-family: var(--read); font-size: 1.12rem; line-height: 1.6; min-height: 9rem; }
.title-input { font-family: var(--read); font-size: clamp(1.7rem, 3.6vw, 2.3rem); font-weight: 600; border: 1.5px solid transparent; border-radius: 8px; background: transparent; padding: 2px 8px; margin-left: -8px; width: 100%; min-width: 0; }
.title-input:hover { border-color: var(--line); }
.status { font-size: .8rem; color: var(--muted); min-height: 1.2em; }
.status.err { color: var(--danger); }

/* Content blocks */
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { font-family: var(--read); font-size: 1.2rem; color: var(--muted); max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section { display: grid; gap: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; }
.facts dt { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.facts dd { margin: 0; }
.scripture { font-family: var(--read); font-size: 1.15rem; font-weight: 500; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink); font-size: .82rem; font-weight: 500; text-decoration: none; border: 0; cursor: pointer; }
a.chip:hover, button.chip:hover { background: var(--accent-soft); }
.chip.lesson { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.chip.flag { background: transparent; border: 1px solid var(--line); color: var(--muted); cursor: default; }
.chip .x { font-weight: 700; color: var(--muted); margin-left: 2px; }
.banner { padding: 12px 16px; border-radius: var(--r); background: var(--accent-soft); font-size: .95rem; }

/* Sermon rows */
.rows { list-style: none; margin: 0; padding: 0; display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.row:first-child { border-top: 0; }
.row .ttl { font-family: var(--read); font-size: 1.15rem; font-weight: 600; line-height: 1.25; text-decoration: none; color: var(--ink); overflow-wrap: anywhere; }
.row .ttl:hover { color: var(--accent); text-decoration: underline; }
.row .meta { grid-column: 1; font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .meta b { color: var(--ink); font-weight: 600; }
.row .snip { grid-column: 1; font-family: var(--read); font-size: 1rem; color: var(--ink); border-left: 3px solid var(--line); padding-left: 10px; }
.row .snip small { display: block; font-family: var(--ui); font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row .side { grid-row: 1 / span 3; grid-column: 2; display: flex; gap: 6px; align-items: center; }
.row .chips { grid-column: 1; }
.more { justify-self: start; }

/* Search controls */
.controls { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: end; }
.controls .field { min-width: 150px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: .92rem; padding-bottom: 8px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Browse */
.books { display: grid; gap: 18px; }
.bookgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.bookgrid a, .bookgrid span { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: .92rem; }
.bookgrid a:hover { border-color: var(--accent); }
.bookgrid span { color: var(--muted); background: transparent; border-style: dashed; }
.bookgrid em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.serieslist { list-style: none; margin: 0; padding: 0; columns: 2 280px; column-gap: 28px; }
.serieslist li { break-inside: avoid; padding: 4px 0; font-size: .95rem; }
.serieslist a { text-decoration: none; color: var(--ink); }
.serieslist a:hover { color: var(--accent); text-decoration: underline; }
.serieslist em { font-style: normal; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.tryline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .92rem; color: var(--muted); }

/* Transcript */
.transcript { max-height: 60vh; overflow: auto; padding: 4px 14px 4px 0; font-family: var(--read); font-size: 1.08rem; line-height: 1.65; display: grid; gap: .8em; }
.transcript p { margin: 0; max-width: 68ch; }
.howto { display: grid; gap: 8px; font-size: .95rem; }
.howto ol { margin: 0; padding-left: 1.3rem; display: grid; gap: 4px; }

.bio { display: grid; gap: 12px; font-family: var(--read); font-size: 1.1rem; line-height: 1.6; }
.bio p { max-width: 66ch; }
.source { font-size: .85rem; color: var(--muted); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--danger); }
.dangerzone { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.warn { color: var(--danger); font-size: .85rem; }
.lesson-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.numbox { display: grid; gap: 2px; justify-items: center; }
.numbox span { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.numbox input { width: 4.2rem; text-align: center; font-family: var(--read); font-size: 1.9rem; font-weight: 600; color: var(--accent); padding: 2px 4px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); font-variant-numeric: tabular-nums; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .outline { position: static; max-height: none; overflow: visible; display: none; }
  body.route-home .outline { display: block; order: 0; }
  main { max-width: none; }
  .study-link { display: inline; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .panel { padding: 16px; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .side { grid-row: auto; grid-column: 1; }
  .facts { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .facts dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ol a, .btn, .chip { transition: background-color .15s, border-color .15s, filter .15s; }
}
</style>
</head>

  '1cor': '1 Corinthians', '2cor': '2 Corinthians', gal: 'Galatians', eph: 'Ephesians', phil: 'Philippians', php: 'Philippians', col: 'Colossians',
  '1thess': '1 Thessalonians', '2thess': '2 Thessalonians', '1thes': '1 Thessalonians', '2thes': '2 Thessalonians', '1tim': '1 Timothy', '2tim': '2 Timothy',
  tit: 'Titus', phlm: 'Philemon', philem: 'Philemon', heb: 'Hebrews', jas: 'James', jam: 'James', '1pet': '1 Peter', '2pet': '2 Peter', '1pt': '1 Peter', '2pt': '2 Peter',

const bookKey = s => String(s).toLowerCase().replace(/\./g, '').trim()
  .replace(/^(first|1st|iii|ii|i)\s+/, m => ({ first: '1', '1st': '1', i: '1', ii: '2', iii: '3' })[m.trim()])
  .replace(/^(second|2nd)\s+/, '2').replace(/^(third|3rd)\s+/, '3').replace(/[^a-z0-9]/g, '');
const CANON_KEYS = CANON.map(b => [bookKey(b), b]);
function findBook(word, exactOnly = false) {
  const k = bookKey(word);
  if (!k) return null;
  if (ALIASES[k]) return ALIASES[k];
  const exact = CANON_KEYS.find(([ck]) => ck === k);
  if (exact) return exact[1];
  if (exactOnly || k.replace(/^\d/, '').length < 3) return null;
  const pre = CANON_KEYS.find(([ck]) => ck.startsWith(k));
  return pre ? pre[1] : null;
}

/* A passage like "Luke 15:1-2, 11-32; John 3" -> [{book:'Luke', ch:15}, {book:'John', ch:3}] */
function parsePassage(text) {
  const toks = [...String(text || '').matchAll(/(\d+)|([A-Za-z]+)|([:;,\-–])/g)].map(m => m[1] ? { n: +m[1] } : m[2] ? { w: m[2] } : { p: m[3] });
  const out = []; let book = null, verse = false;
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t.w) {
      let b = null;
      const prev = toks[i - 1];
      if (prev && prev.n >= 1 && prev.n <= 3 && !(toks[i - 2] && toks[i - 2].p === ':')) b = findBook(prev.n + t.w);
      if (!b) b = findBook(t.w);
      if (!b && t.w.toLowerCase() === 'of' && toks[i + 1] && toks[i + 1].w) continue;
      if (b) {
        if (book !== b || verse) { book = b; verse = false; }
        if (!toks[i + 1] || !toks[i + 1].n) out.push({ book: b, ch: null });
      }
    } else if (t.p === ':') verse = true;
    else if (t.p === ';') verse = false;
    else if (t.n != null && book) {
      const next = toks[i + 1];
      const nextWord = next && next.w && findBook(t.n + next.w);
      if (nextWord) continue;
      if (next && next.p === ':') { verse = false; }
      if (!verse) out.push({ book, ch: t.n });
    }
  }
  const seen = new Set(), withCh = new Set(out.filter(r => r.ch != null).map(r => r.book));
  return out.filter(r => {
    const k = r.book + ':' + r.ch;
    if (seen.has(k) || (r.ch == null && withCh.has(r.book))) return false;
    seen.add(k); return true;
  });
}

/* A whole query that is just a reference: "rom 8", "Psalm 23:1", "John" */
function parseRefQuery(q) {
  const m = String(q).trim().match(/^((?:[123]|i{1,3}|first|second|third)?\s*[a-z]+(?:\s+(?:of\s+)?[a-z]+)?)\.?\s*(\d{1,3})?(?:\s*:\s*\d{1,3}(?:\s*[-–]\s*\d{1,3})?)?$/i);
  if (!m) return null;
  const book = findBook(m[1], !m[2]);
  return book ? { book, ch: m[2] ? +m[2] : null } : null;
}

const SERIES = RAW.series.map(([slug, name], i) => ({ i, slug, name, sermons: [] }));
const TOPICS = RAW.topics.map(([slug, name], i) => ({ i, slug, name, sermons: [] }));
const SERMONS = RAW.sermons.map(([id, title, date, scripture, dur, talk, yt, slug, series, topics, refs]) => {
  const s = { id, title, date, year: +date.slice(0, 4), scripture, dur, talk: !!talk, yt, slug, series, topics, refs: [] };
  const seen = new Set();
  for (const r of refs.concat(parsePassage(scripture).map(x => x.book + (x.ch ? ' ' + x.ch : '')))) {
    const m = r.match(/^(.*?)(?:\s+(\d+))?$/);
    const book = findBook(m[1], true) || m[1];
    const key = book + ':' + (m[2] || '');
    if (seen.has(key)) continue;
    seen.add(key); s.refs.push({ book, ch: m[2] ? +m[2] : null });
  }
  // A book-only tag adds nothing when the same book also has a chapter
  s.refs = s.refs.filter(r => r.ch != null || !s.refs.some(x => x.book === r.book && x.ch != null));
  s.hay = { title: title.toLowerCase(), series: series.map(i => RAW.series[i][1]).join(' | ').toLowerCase(),
    topics: topics.map(i => RAW.topics[i][1]).join(' | ').toLowerCase(), scripture: scripture.toLowerCase() };
  series.forEach(i => SERIES[i].sermons.push(s));
  topics.forEach(i => TOPICS[i].sermons.push(s));
  return s;
});

function tokenize(q) {
  const out = [];
  String(q).toLowerCase().replace(/"([^"]+)"|(\S+)/g, (_, ph, w) => {
    const t = (ph || w).replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');

  const low = String(text).toLowerCase();

  if (at < 0) return '';
  const a = Math.max(0, at - size), b = Math.min(text.length, at + size);

/* ---------- Search ---------- */
const refMatches = (s, ref) => s.refs.some(r => r.book === ref.book && (ref.ch == null || r.ch === ref.ch));
function searchSermons(q, opts = {}) {
  const toks = tokenize(q);
  const ref = parseRefQuery(q);
  const res = [];
  if (!toks.length && !ref) return { toks, ref, list: res };
  for (const s of SERMONS) {
    if (opts.type === 'sermon' && s.talk) continue;
    if (opts.type === 'talk' && !s.talk) continue;
    const note = noteText('sermon-' + s.id), tr = transcriptOf(s.id), inLesson = lessonsFor(s.id).length > 0;
    if (opts.mine && !note && !tr && !inLesson) continue;
    let score = 0;
    const where = [];
    if (ref && refMatches(s, ref)) score = 30;
    else {
      // Every word has to appear somewhere: title, series, topics, scripture, year, your notes or your transcript
      const nl = note.toLowerCase(), tl = tr.toLowerCase();
      for (const t of toks) {
        let hit = 0;
        if (s.hay.title.includes(t)) hit += 8;
        if (s.hay.series.includes(t)) hit += 3;
        if (s.hay.topics.includes(t)) hit += 3;
        if (s.hay.scripture.includes(t)) hit += 3;
        if (String(s.year) === t) hit += 2;
        if (nl.includes(t)) { hit += 2; if (!where.includes('note')) where.push('note'); }
        if (tl.includes(t)) { hit += 1; if (!where.includes('transcript')) where.push('transcript'); }
        if (!hit) { score = 0; break; }
        score += hit;
      }
    }
    if (score) res.push({ s, score, where, note, tr });
  }
  const by = { best: (a, b) => b.score - a.score || b.s.date.localeCompare(a.s.date), new: (a, b) => b.s.date.localeCompare(a.s.date), old: (a, b) => a.s.date.localeCompare(b.s.date) };
  res.sort(by[opts.sort || 'best']);
  return { toks, ref, list: res };
}
function searchStudy(toks) {
  if (!toks.length) return [];
  const out = [];
  for (const it of outlineItems()) {
    const d = it.doc, key = (it.kind === 'lesson' ? 'lesson-' : 'page-') + d.id;
    const parts = it.kind === 'lesson'
      ? [['title', `Lesson ${d.num} ${d.title || ''}`], ['passage', d.passage || ''], ['note', noteText(key)]]
      : [['title', d.title || ''], ['page', d.body || ''], ['note', noteText(key)]];
    const all = parts.map(p => p[1]).join('\n').toLowerCase();
    if (!toks.every(t => all.includes(t))) continue;
    const hitPart = parts.find(([k, v]) => k !== 'title' && toks.some(t => v.toLowerCase().includes(t)));
    out.push({ it, key, hitPart });
  }
  return out;
}
function sermonsForPassage(passage) {
  const refs = parsePassage(passage);
  if (!refs.length) return [];
  const seen = new Set(), out = [];
  for (const r of refs) {
    const hits = SERMONS.filter(s => !seen.has(s.id) && refMatches(s, r)).sort((a, b) => a.date.localeCompare(b.date));
    hits.forEach(s => { seen.add(s.id); out.push(s); });
  }
  return out;
}

/* ---------- Database ---------- */
function setStatus(path, state, msg) {
  document.querySelectorAll(`[data-status="${CSS.escape(path)}"]`).forEach(el => {
    el.classList.toggle('err', state === 'error');
    el.textContent = state === 'saving' || state === 'pending' ? 'Saving…' : state === 'saved' ? 'Saved' : state === 'error' ? msg : '';
  });
}
function writeError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') {
    S.readOnly = true; S.lastErr = 'This notebook is read-only for you, so changes can’t be saved.';
  } else if (code === 'quota_exceeded') S.lastErr = 'The notebook is full. Delete some notes or transcripts, then try again.';
  else if (code === 'local') S.lastErr = 'Couldn’t save in this browser. Reload the page and try again.';
  else S.lastErr = 'Couldn’t save. Check your connection and try again.';
  scheduleRender(true);
  return S.lastErr;
}
const savers = {};
function saveSoon(path, fields, op = 'set', wait = 700) {
  if (!canWrite()) return;
  const s = savers[path] || (savers[path] = { timer: null, busy: false, next: null, op });
  s.op = op;
  s.next = op === 'set' ? fields : { ...(s.next || {}), ...fields };
  S.drafts[path] = { ...(S.drafts[path] || {}), ...fields };
  setStatus(path, 'pending');
  clearTimeout(s.timer);
  s.timer = setTimeout(() => runSave(path), wait);
}
async function runSave(path) {
  const s = savers[path];
  if (!s || s.busy || !s.next) return;
  const data = s.next; s.next = null; s.busy = true;
  setStatus(path, 'saving');
  try {
    if (s.op === 'set') await DB.doc(path).set(data); else await DB.doc(path).update(data);
    const dr = S.drafts[path];
    if (dr) { for (const k of Object.keys(data)) if (dr[k] === data[k]) delete dr[k]; if (!Object.keys(dr).length) delete S.drafts[path]; }
    setStatus(path, s.next ? 'pending' : 'saved');
  } catch (e) {
    s.next = null; setStatus(path, 'error', writeError(e));
  }
  s.busy = false;
  if (s.next) runSave(path);
}
async function write(fn) {
  if (!canWrite()) return false;
  try { await fn(); return true; } catch (e) { writeError(e); return false; }
}
function flushAll() { for (const p of Object.keys(savers)) { clearTimeout(savers[p].timer); runSave(p); } }

const inClaude = () => !!(window.claude && window.claude.use);
const cantSave = what => inClaude() ? `${what} can be kept when this page is opened from its link while signed in.`
  : `${what} can’t be saved because this browser is blocking storage for the page. Private or incognito windows do this.`;

// Opened on its own (not inside Claude), the study is kept in this browser's IndexedDB behind the same doc/collection calls.
async function browserDb() {
  if (!window.indexedDB) return null;
  const idb = await new Promise((ok, no) => {
    const rq = indexedDB.open('keller-notebook', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('docs');
    rq.onsuccess = () => ok(rq.result);
    rq.onerror = () => no(rq.error);
  });
  const docs = new Map();
  await new Promise((ok, no) => {
    const tx = idb.transaction('docs');
    const rq = tx.objectStore('docs').openCursor();
    rq.onsuccess = () => { const c = rq.result; if (c) { docs.set(c.key, c.value); c.continue(); } };
    tx.oncomplete = ok; tx.onerror = () => no(tx.error);
  });
  const subs = {};
  const snap = col => ({ docs: [...docs].filter(([p]) => p.startsWith(col + '/')).map(([p, v]) => ({ id: p.slice(col.length + 1), data: () => v })) });
  const apply = changes => {
    for (const [p, v] of Object.entries(changes)) if (v === null) docs.delete(p); else docs.set(p, v);
    for (const col of new Set(Object.keys(changes).map(p => p.split('/')[0]))) (subs[col] || []).forEach(fn => fn(snap(col)));
  };
  // Other tabs on the same study hear about each write
  const chan = window.BroadcastChannel ? new BroadcastChannel('keller-notebook') : null;
  if (chan) chan.onmessage = e => apply(e.data);
  let askedToKeep = false;
  // changes: { path: data, or null to delete }
  const commit = changes => new Promise((ok, no) => {
    const tx = idb.transaction('docs', 'readwrite'), store = tx.objectStore('docs');
    for (const [p, v] of Object.entries(changes)) if (v === null) store.delete(p); else store.put(v, p);
    tx.oncomplete = () => {
      apply(changes);
      if (chan) chan.postMessage(changes);
      // Ask the browser not to clear the study when disk space runs low
      if (!askedToKeep && navigator.storage && navigator.storage.persist) { askedToKeep = true; navigator.storage.persist().catch(() => {}); }
      ok();
    };
    tx.onerror = tx.onabort = () => no({ code: tx.error && tx.error.name === 'QuotaExceededError' ? 'quota_exceeded' : 'local' });
  });
  return {
    local: true,
    collection: col => ({ onSnapshot(fn) { (subs[col] || (subs[col] = [])).push(fn); fn(snap(col)); } }),
    doc: path => ({
      set: data => commit({ [path]: { ...data } }),
      // A doc deleted while an edit was waiting to save stays deleted
      update: data => docs.has(path) ? commit({ [path]: { ...docs.get(path), ...data } }) : Promise.resolve(),
      delete: () => commit({ [path]: null }),
    }),
    dump: () => Object.fromEntries(docs),
    load: all => commit(all),
  };
}

/* ---------- Backups (browser storage only) ---------- */
const BACKUP_APP = 'keller-sermon-notebook';
const STUDY_DOC = /^(lessons|pages|notes|transcripts)\/[^/]+$/;
function lastBackup() { try { return +localStorage.getItem('keller-notebook:lastBackup') || 0; } catch { return 0; } }
function downloadBackup() {
  const now = new Date();
  const file = new Blob([JSON.stringify({ app: BACKUP_APP, version: 1, savedAt: now.toISOString(), docs: DB.dump() })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = `keller-study-${now.toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  try { localStorage.setItem('keller-notebook:lastBackup', String(now.getTime())); } catch { /* the reminder just stays */ }
  S.restore = { done: 'Backup downloaded. Keep the file somewhere safe, like your email or a USB stick.' };
  render();
}
async function readBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== BACKUP_APP || !data.docs || typeof data.docs !== 'object') throw new Error('not a backup');
    const docs = {};
    for (const [p, v] of Object.entries(data.docs)) if (STUDY_DOC.test(p) && v && typeof v === 'object' && !Array.isArray(v)) docs[p] = v;
    const count = col => Object.keys(docs).filter(p => p.startsWith(col + '/')).length;
    return { docs, savedAt: data.savedAt, summary: [plural(count('lessons'), 'lesson'), plural(count('pages'), 'page'), plural(count('notes'), 'note'), plural(count('transcripts'), 'transcript')] };
  } catch { return { error: 'That file isn’t a notebook backup. Choose the file the notebook downloaded, named like keller-study-2026-10-29.json.' }; }
}
async function loadBackup() {
  if (await write(() => DB.load(S.restore.docs))) { S.restore = { done: 'Backup loaded.' }; render(); }
}
function backupHTML() {
  if (!DB || !DB.local) return '';
  const r = S.restore || {}, at = lastBackup();
  const day = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const stale = (S.lessons.length || S.pages.length) && Date.now() - at > 30 * 864e5;
  let msg = '';
  if (r.error) msg = `<p class="warn">${esc(r.error)}</p>`;
  else if (r.done) msg = `<p class="small">${esc(r.done)}</p>`;
  else if (r.docs) msg = `<div class="confirm"><span class="small">Load the backup${r.savedAt ? ' from ' + esc(day(r.savedAt)) : ''}? It has ${esc(r.summary.join(', '))}.
      Anything in the backup replaces the copy here; everything else stays.</span>
      <button class="btn small" data-act="restore-go">Load it</button><button class="btn ghost small" data-act="restore-cancel">Cancel</button></div>`;
  return `<div class="ol-keep">
    <p class="small ${stale ? 'warn' : 'muted'}">Your study is saved in this browser on this computer. ${at ? `Last backup: ${esc(day(at))}.` : 'Download a backup now and then to keep it safe or to move it to another computer.'}</p>
    <div class="ol-add"><button class="btn ghost small" data-act="backup">Download a backup</button>
      <label class="btn ghost small" for="restore-file">Load a backup</label><input id="restore-file" type="file" accept=".json,application/json" hidden></div>
    ${msg}
  </div>`;
}

async function startDb() {
  const db = inClaude() ? await window.claude.use('db').catch(() => null) : await browserDb().catch(() => null);
  if (!db) { S.db = 'off'; scheduleRender(true); return; }
  DB = db;
  if (!DB.local) try {
    const user = await window.claude.use('user').catch(() => null);
    if (user) { S.write = await user.can('data.write'); if (S.write === false) S.readOnly = true; }
  } catch { /* keep inputs; a refused write decides */ }
  let loaded = 0;
  const ready = () => { if (++loaded === 4) S.db = 'ready'; scheduleRender(); };
  const fail = e => { if (S.db !== 'ready') S.db = 'off'; S.lastErr = e && e.code === 'revoked' ? '' : 'Your study couldn’t load. Reload the page to try again.'; scheduleRender(true); };
  const once = fn => { let first = true; return snap => { fn(snap); if (first) { first = false; ready(); } else scheduleRender(); }; };
  DB.collection('lessons').onSnapshot(once(snap => { S.lessons = snap.docs.map(d => ({ id: d.id, ...d.data() })); }), fail);
  DB.collection('pages').onSnapshot(once(snap => { S.pages = snap.docs.map(d => ({ id: d.id, ...d.data() })); }), fail);
  DB.collection('notes').onSnapshot(once(snap => { S.notes = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); }), fail);
  DB.collection('transcripts').onSnapshot(once(snap => { S.transcripts = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); }), fail);
}

async function toggleSermon(kind, id, sid, on) {
  const doc = kind === 'lesson' ? lessonById(id) : pageById(id);
  if (!doc) return;
  const list = (doc.sermons || []).filter(x => x !== sid);
  if (on) list.push(sid);
  await write(() => DB.doc(`${kind}s/${id}`).update({ sermons: list }));

async function moveSermon(kind, id, sid, dir) {
  const doc = kind === 'lesson' ? lessonById(id) : pageById(id);
  const list = [...(doc.sermons || [])], i = list.indexOf(sid), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  await write(() => DB.doc(`${kind}s/${id}`).update({ sermons: list }));
}

    <p>Timothy J. Keller (1950–2023) was a Presbyterian pastor and author. Born in Allentown, Pennsylvania, he studied at Bucknell University, Gordon-Conwell Theological Seminary and Westminster Theological Seminary. He pastored West Hopewell Presbyterian Church in Hopewell, Virginia, for nine years and taught at Westminster Theological Seminary in Philadelphia.</p>
    <p>In 1989 he founded Redeemer Presbyterian Church in Manhattan, and he was its senior pastor until 2017. He co-founded The Gospel Coalition and wrote books including <i>The Reason for God</i> (2008), <i>The Prodigal God</i> (2008), <i>Prayer</i> (2014) and <i>Making Sense of God</i> (2016). He died in New York on May 19, 2023.</p>
    <p class="source">Sermon list: <a href="https://gospelinlife.com/sermons/" target="_blank" rel="noopener">Gospel in Life</a>, which offers every sermon free to listen to. It doesn’t publish transcripts or allow its recordings to be reposted, so each sermon here links to its page there. Biography: <a href="https://en.wikipedia.org/wiki/Tim_Keller_(pastor)" target="_blank" rel="noopener">Wikipedia</a>.</p>
  </section>`;
}

function viewSearch() {
  const { toks, ref, list } = searchSermons(S.q, { sort: S.sort, type: S.type, mine: S.mine });
  const study = searchStudy(toks);
  const head = S.q ? `${plural(list.length, 'sermon')} for “${esc(S.q)}”${ref ? ` <span class="muted">(${esc(ref.book)}${ref.ch ? ' ' + ref.ch : ''})</span>` : ''}` : 'Search';
  const studyHTML = study.length ? `<section class="panel"><h2>In your study</h2><ul class="rows">${study.map(({ it, key, hitPart }) => {
      const d = it.doc, href = `#${it.kind}-${esc(d.id)}`;
      const title = it.kind === 'lesson' ? lessonLabel(d) : (d.title || 'Untitled page');
      const sn = hitPart ? `<p class="snip"><small>${hitPart[0] === 'note' ? 'Your notes' : hitPart[0] === 'passage' ? 'Passage' : 'Page'}</small>${snippet(hitPart[1], toks)}</p>` : '';
      return `<li class="row"><a class="ttl" href="${href}">${hl(title, toks)}</a><div class="meta">${it.kind === 'lesson' ? 'Lesson' : 'Page'}</div>${sn}</li>`;
    }).join('')}</ul></section>` : '';
  const rows = rowsHTML(list, x => {
    const sn = x.where.includes('note') ? `<p class="snip"><small>Your notes</small>${snippet(x.note, toks)}</p>`
      : x.where.includes('transcript') ? `<p class="snip"><small>Transcript</small>${snippet(x.tr, toks)}</p>` : '';
    return { toks, snip: sn };
  }, S.limit, 'more-results');
  return `${bannerHTML()}
  <section class="section">
    <h1>${head}</h1>
    <div class="controls">
      <label class="field"><span>Order</span><select id="sort"><option value="best"${S.sort === 'best' ? ' selected' : ''}>Best match</option><option value="new"${S.sort === 'new' ? ' selected' : ''}>Newest first</option><option value="old"${S.sort === 'old' ? ' selected' : ''}>Oldest first</option></select></label>
      <label class="field"><span>Show</span><select id="type"><option value="all"${S.type === 'all' ? ' selected' : ''}>Sermons and talks</option><option value="sermon"${S.type === 'sermon' ? ' selected' : ''}>Sermons only</option><option value="talk"${S.type === 'talk' ? ' selected' : ''}>Talks only</option></select></label>
      <label class="check"><input type="checkbox" id="mine"${S.mine ? ' checked' : ''}> Only ones in my lessons, notes or transcripts</label>
    </div>
  </section>
  ${studyHTML}
  <section class="section">${list.length ? rows : `<p class="muted">${S.q ? 'No sermons match. Try fewer words, a Bible book like “Romans”, or a topic like “grace”.' : 'Type a word, a topic or a passage like “John 3” in the search bar.'}</p>`}</section>`;
}

function viewSermon(s) {
  if (!s) return `<h1>Sermon not found</h1><p><a href="#home">Back to the start</a></p>`;
  const toks = tokenize(S.q);
  const ls = lessonsFor(s.id), ps = pagesFor(s.id);
  const tr = transcriptOf(s.id);
  const lessonsHTML = `<section class="panel">
    <div class="panel-head"><h2>Your lessons</h2></div>
    ${ls.length || ps.length ? `<div class="chips">${ls.map(l => `<span class="chip lesson"><a href="#lesson-${esc(l.id)}" style="color:inherit;text-decoration:none">${esc(lessonLabel(l))}</a>${canWrite() ? ` <button class="chip" style="padding:0 4px" data-act="unlink" data-kind="lesson" data-id="${esc(l.id)}" aria-label="Remove from ${esc(lessonLabel(l))}"><span class="x">✕</span></button>` : ''}</span>`).join('')}
      ${ps.map(p => `<a class="chip" href="#page-${esc(p.id)}">${esc(p.title || 'Untitled page')}</a>`).join('')}</div>` : '<p class="muted">Not in any lesson yet.</p>'}
    ${canWrite() ? `<label class="field" style="max-width:420px"><span>Add to a lesson</span><select id="add-to-lesson"><option value="">Choose a lesson…</option>
      ${lessonsSorted().filter(l => !(l.sermons || []).includes(s.id)).map(l => `<option value="${esc(l.id)}">${esc(lessonLabel(l))}</option>`).join('')}
      <option value="__new">New lesson…</option></select></label>` : ''}
  </section>`;
  let trHTML;
  const path = 'transcripts/s' + s.id;
  if (!DB) trHTML = `<p class="muted">${cantSave('Transcripts')}</p>`;
  else if (tr && !S.editingTranscript) {
    const find = S.findIn || (toks.length ? S.q : '');
    const ft = tokenize(find);
    const count = ft.length ? ft.reduce((n, t) => n + (tr.toLowerCase().split(t).length - 1), 0) : 0;
    trHTML = `<div class="controls"><label class="field" style="flex:1 1 240px"><span>Find in transcript</span><input id="find-in" type="search" value="${esc(find)}" placeholder="A word or phrase"></label>
      <p class="muted small" style="padding-bottom:10px">${ft.length ? plural(count, 'match', 'matches') : plural(words(tr), 'word')}</p></div>
      <div class="transcript" id="transcript-view">${tr.split(/\n\s*\n|\n/).filter(p => p.trim()).map(p => `<p>${hl(p, ft)}</p>`).join('')}</div>
      ${canWrite() ? `<div class="actions"><button class="btn ghost small" data-act="edit-transcript">Edit transcript</button>${S.confirm === 'tr-' + s.id
        ? `<span class="confirm"><span>Remove the saved transcript?</span><button class="btn danger solid small" data-act="del-transcript">Remove</button><button class="btn ghost small" data-act="cancel">Keep it</button></span>`
        : `<button class="btn danger small" data-act="ask-del-transcript">Remove</button>`}</div>` : ''}`;
  } else if (canWrite()) {
    trHTML = `<div class="howto">
        <p>Gospel in Life doesn’t publish transcripts, but YouTube shows one for most of these sermons:</p>
        <ol><li>${s.yt ? `Open the <a href="${esc(ytUrl(s))}" target="_blank" rel="noopener">video on YouTube</a>.` : `<a href="${esc(ytUrl(s))}" target="_blank" rel="noopener">Find the video on YouTube</a> (Gospel in Life’s channel).`}</li>
          <li>Under the video, click <b>…more</b>, then <b>Show transcript</b>.</li><li>Select the transcript text, copy it, and paste it below.</li></ol>
        <p class="muted small">It stays in this notebook for your own study and becomes searchable. You can also load a .txt file.</p>
      </div>
      <textarea id="transcript-input" class="inline-input writing" rows="10" placeholder="Paste the transcript here">${esc(S.drafts[path]?.text ?? tr)}</textarea>
      <div class="actions"><button class="btn" data-act="save-transcript">Save transcript</button>
        <label class="btn ghost" for="transcript-file">Load a .txt file</label><input id="transcript-file" type="file" accept=".txt,text/plain" hidden>
        ${tr ? '<button class="btn ghost" data-act="cancel-transcript">Cancel</button>' : ''}<span class="status" data-status="${esc(path)}"></span></div>`;
  } else trHTML = '<p class="muted">No transcript saved.</p>';
  const series = s.series.map(i => SERIES[i]);
  const more = series[0] ? series[0].sermons.filter(x => x.id !== s.id) : [];
  const chRef = s.refs.find(r => r.ch != null);
  const same = chRef ? SERMONS.filter(x => x.id !== s.id && x.refs.some(r => r.book === chRef.book && r.ch === chRef.ch) && !more.includes(x)) : [];
  return `${bannerHTML()}
  <section class="section">
    <p class="eyebrow">${s.talk ? 'Talk' : 'Sermon'} · ${fmtDate(s.date)}${s.dur ? ' · ' + mins(s.dur) : ''}</p>
    <h1>${hl(s.title, toks)}</h1>
    <dl class="facts">
      ${s.scripture ? `<dt>Scripture</dt><dd class="scripture">${esc(s.scripture)}</dd>` : ''}
      ${series.length ? `<dt>Series</dt><dd>${series.map(se => `<a href="#series-${se.i}">${esc(se.name)}</a>`).join(', ')}</dd>` : ''}
      ${s.topics.length ? `<dt>Topics</dt><dd class="chips">${s.topics.map(i => `<a class="chip" href="#topic-${i}">${esc(TOPICS[i].name)}</a>`).join('')}</dd>` : ''}

    <div class="actions"><a class="btn" href="${esc(sermonUrl(s))}" target="_blank" rel="noopener">Listen at Gospel in Life ↗</a>
      <a class="btn ghost" href="${esc(ytUrl(s))}" target="_blank" rel="noopener">${s.yt ? 'Watch on YouTube ↗' : 'Find on YouTube ↗'}</a></div>
  </section>
  ${lessonsHTML}
  ${notesPanel('sermon-' + s.id, 'Your notes on this sermon: key points, quotes, questions for the group…')}
  <section class="panel"><div class="panel-head"><h2>Transcript</h2>${tr && !S.editingTranscript ? `<span class="muted small">${plural(words(tr), 'word')}</span>` : ''}</div>${trHTML}</section>
  ${more.length ? `<section class="section"><h2>More from ${esc(series[0].name)}</h2>${rowsHTML(more, {}, 8)}<a href="#series-${series[0].i}">See the whole series</a></section>` : ''}
  ${same.length ? `<section class="section"><h2>Also on ${esc(chRef.book)} ${chRef.ch}</h2>${rowsHTML(same, {}, 8)}</section>` : ''}`;
}

function sermonPicker(kind, doc, path) {
  const linked = (doc.sermons || []).map(id => BYID.get(id)).filter(Boolean);
  const editable = canWrite();
  const linkedHTML = linked.length ? `<ul class="rows">${linked.map((s, i) => sermonRow(s, { side: editable ? `
      <button class="btn ghost small" data-act="move" data-kind="${kind}" data-id="${esc(doc.id)}" data-sid="${s.id}" data-dir="-1" aria-label="Move up"${i === 0 ? ' disabled' : ''}>↑</button>
      <button class="btn ghost small" data-act="move" data-kind="${kind}" data-id="${esc(doc.id)}" data-sid="${s.id}" data-dir="1" aria-label="Move down"${i === linked.length - 1 ? ' disabled' : ''}>↓</button>
      <button class="btn danger small" data-act="toggle" data-kind="${kind}" data-id="${esc(doc.id)}" data-sid="${s.id}" data-on="0">Remove</button>` : '' })).join('')}</ul>`
    : `<p class="muted">No sermons yet.${editable ? ' Find one below, or open any sermon and use “Add to a lesson”.' : ''}</p>`;
  const addBtn = s => editable ? `<button class="btn small" data-act="toggle" data-kind="${kind}" data-id="${esc(doc.id)}" data-sid="${s.id}" data-on="1">Add</button>` : '';
  const notLinked = s => !(doc.sermons || []).includes(s.id);
  let finder = '';
  if (editable) {
    const r = S.findLesson ? searchSermons(S.findLesson, { sort: 'best' }).list.map(x => x.s).filter(notLinked) : [];
    const ft = tokenize(S.findLesson);
    finder = `<label class="field"><span>Find a sermon to add</span><input id="find-sermon" type="search" value="${esc(S.findLesson)}" placeholder="Title, topic, or a passage like Luke 15"></label>
      ${S.findLesson ? (r.length ? `<ul class="rows">${r.slice(0, 12).map(s => sermonRow(s, { toks: ft, side: addBtn(s) })).join('')}</ul>${r.length > 12 ? `<p class="muted small">Showing 12 of ${r.length}. Add more words to narrow it down.</p>` : ''}` : '<p class="muted">No sermons match.</p>') : ''}`;
  }
  const passage = field(path, doc, 'passage');
  const sugg = kind === 'lesson' && passage ? sermonsForPassage(passage).filter(notLinked) : [];
  return `<section class="panel">
    <div class="panel-head"><h2>Sermons${kind === 'lesson' ? ' for this lesson' : ' on this page'}</h2><span class="muted small">${plural(linked.length, 'sermon')}</span></div>
    ${linkedHTML}
  </section>
  ${editable || sugg.length ? `<section class="panel">
    ${kind === 'lesson' ? `<div class="panel-head"><h2>Sermons on ${esc(passage || 'this passage')}</h2>${sugg.length ? `<span class="muted small">${plural(sugg.length, 'match', 'matches')}</span>` : ''}</div>
      ${passage ? (sugg.length ? `<ul class="rows">${sugg.slice(0, S.suggLimit || 10).map(s => sermonRow(s, { side: addBtn(s) })).join('')}</ul>${sugg.length > (S.suggLimit || 10) ? `<button class="btn ghost small more" data-act="more-sugg">Show more (${sugg.length - (S.suggLimit || 10)})</button>` : ''}`
        : '<p class="muted">No sermons found on this passage. Try searching by topic below.</p>') : '<p class="muted">Enter the lesson’s passage above to see Keller’s sermons on it.</p>'}` : ''}
    ${finder}
  </section>` : ''}`;
}

  const path = 'lessons/' + l.id, ro = canWrite() ? '' : ' readonly';
  const num = field(path, l, 'num'), dup = S.lessons.some(x => x.id !== l.id && +x.num === +num);
  return `${bannerHTML()}
  <section class="section">

function viewList(kind, x) {
  if (!x) return `<h1>Not found</h1><p><a href="#home">Back to the start</a></p>`;
  if (kind === 'book') {
    const chs = [...new Set(x.sermons.flatMap(s => s.refs.filter(r => r.book === x.name && r.ch != null).map(r => r.ch)))].sort((a, b) => a - b);
    const ch = S.bookCh;
    const list = (ch ? x.sermons.filter(s => s.refs.some(r => r.book === x.name && r.ch === ch)) : x.sermons).slice()
      .sort((a, b) => {
        const ca = Math.min(...a.refs.filter(r => r.book === x.name).map(r => r.ch ?? 999)), cb = Math.min(...b.refs.filter(r => r.book === x.name).map(r => r.ch ?? 999));
        return ca - cb || a.date.localeCompare(b.date);
      });
    return `${bannerHTML()}<section class="section"><p class="eyebrow">Book of the Bible</p><h1>${esc(x.name)}</h1>
      <p class="muted">${plural(list.length, 'sermon')}${ch ? ` on chapter ${ch}` : ''}, in chapter order.</p>
      ${chs.length ? `<div class="chips"><button class="chip${ch ? '' : ' lesson'}" data-ch="">All chapters</button>${chs.map(c => `<button class="chip${c === ch ? ' lesson' : ''}" data-ch="${c}">${c}</button>`).join('')}</div>` : ''}
      </section><section class="section">${rowsHTML(list, {}, S.limit, 'more-results')}</section>`;
  }
  const list = kind === 'series' ? x.sermons : [...x.sermons].sort((a, b) => b.date.localeCompare(a.date));
  return `${bannerHTML()}<section class="section"><p class="eyebrow">${kind === 'series' ? 'Sermon series' : 'Topic'}</p><h1>${esc(x.name)}</h1>
    <p class="muted">${plural(list.length, 'sermon')}${kind === 'series' ? ', in the order preached' : ', newest first'}.</p></section>
    <section class="section">${rowsHTML(list, {}, S.limit, 'more-results')}</section>`;
}

/* ---------- Router and render ---------- */
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^(sermon|lesson|page|book|series|topic)-(.+)$/);
  if (m) return { name: m[1], id: m[1] === 'sermon' || m[1] === 'book' || m[1] === 'series' || m[1] === 'topic' ? +m[2] : m[2] };
  if (h === 'search') return { name: 'search' };
  return { name: 'home' };
}
let lastInputAt = 0, renderQueued = false, pendingTimer = null;
function scheduleRender(now) {
  if (renderQueued) return;
  const el = document.activeElement;
  const typing = el && el.closest && el.closest('#main') && /^(INPUT|TEXTAREA)$/.test(el.tagName) && Date.now() - lastInputAt < 1500;
  if (typing && !now) { clearTimeout(pendingTimer); pendingTimer = setTimeout(() => scheduleRender(true), 1600); return; }
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function render() {
  const a = document.activeElement;
  const keep = a && a.id && a.closest && a.closest('#main, #outline') ? { id: a.id, start: a.selectionStart, end: a.selectionEnd, scroll: a.scrollTop } : null;
  const r = S.route;
  document.body.classList.toggle('route-home', r.name === 'home');
  renderOutline();
  let html;
  if (r.name === 'sermon') html = viewSermon(BYID.get(r.id));
  else if (r.name === 'lesson') html = viewLesson(lessonById(r.id));
  else if (r.name === 'page') html = viewPage(pageById(r.id));
  else if (r.name === 'book') html = viewList('book', BOOKS[r.id]);
  else if (r.name === 'series') html = viewList('series', SERIES[r.id]);
  else if (r.name === 'topic') html = viewList('topic', TOPICS[r.id]);
  else if (r.name === 'search') html = viewSearch();
  else html = viewHome();
  $('#main').innerHTML = html;
  document.title = 'Keller Sermon Notebook';
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.focus({ preventScroll: true }); try { if (keep.start != null) el.setSelectionRange(keep.start, keep.end); } catch { /* not a text field */ } el.scrollTop = keep.scroll; }
  }
  if (S.focus) { const el = document.getElementById(S.focus); if (el) el.focus(); S.focus = null; }
}
function go() {
  const prev = S.route;
  S.route = parseHash();
  const changed = prev.name !== S.route.name || prev.id !== S.route.id;
  if (changed) { S.confirm = null; S.editingTranscript = false; S.findIn = ''; S.limit = 40; S.findLesson = ''; S.suggLimit = 10; S.restore = null; if (S.route.name !== 'book') S.bookCh = null; }
  render();
  if (changed) window.scrollTo(0, 0);
}

/* ---------- Events ---------- */
$('#search-form').addEventListener('submit', e => {
  e.preventDefault();
  S.q = $('#q').value.trim(); S.limit = 40;
  if (location.hash === '#search') render(); else location.hash = 'search';
});
let qTimer;
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    S.q = e.target.value.trim(); S.limit = 40;
    if (S.route.name === 'search') render();
    else if (S.q.length >= 3) location.hash = 'search';
  }, 250);
});

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act], [data-try], [data-ch]');
  if (!t) return;
  if (t.dataset.try) { S.q = t.dataset.try; $('#q').value = S.q; location.hash = 'search'; return; }
  if (t.dataset.ch !== undefined && !t.dataset.act) { S.bookCh = t.dataset.ch ? +t.dataset.ch : null; S.limit = 40; render(); return; }
  const act = t.dataset.act, r = S.route;
  if (act === 'add-lesson') return addLesson();
  if (act === 'add-page') return addPage(r.name === 'lesson' ? lessonById(r.id)?.num : undefined);
  if (act === 'add-page-after') return addPage(+t.dataset.after);
  if (act === 'backup') return downloadBackup();
  if (act === 'restore-go') return loadBackup();
  if (act === 'restore-cancel') { S.restore = null; return render(); }
  if (act === 'more-results') { S.limit += 40; return render(); }
  if (act === 'more-sugg') { S.suggLimit = (S.suggLimit || 10) + 20; return render(); }
  if (act === 'toggle') return toggleSermon(t.dataset.kind, t.dataset.id, +t.dataset.sid, t.dataset.on === '1');
  if (act === 'move') return moveSermon(t.dataset.kind, t.dataset.id, +t.dataset.sid, +t.dataset.dir);
  if (act === 'unlink') return toggleSermon(t.dataset.kind, t.dataset.id, r.id, false);
  if (act === 'ask-del') { S.confirm = t.dataset.key; return render(); }
  if (act === 'cancel') { S.confirm = null; return render(); }
  if (act === 'del') return remove(t.dataset.kind, t.dataset.id);
  if (act === 'edit-transcript') { S.editingTranscript = true; return render(); }
  if (act === 'cancel-transcript') { S.editingTranscript = false; delete S.drafts['transcripts/s' + r.id]; return render(); }
  if (act === 'ask-del-transcript') { S.confirm = 'tr-' + r.id; return render(); }
  if (act === 'del-transcript') {
    if (await write(() => DB.doc('transcripts/s' + r.id).delete())) { S.confirm = null; S.editingTranscript = false; render(); }
    return;
  }
  if (act === 'save-transcript') {
    const text = ($('#transcript-input')?.value || '').trim();
    const path = 'transcripts/s' + r.id;
    if (!text) { setStatus(path, 'error', 'Paste a transcript first.'); return; }
    setStatus(path, 'saving');
    const ok = await write(() => DB.doc(path).set({ text, sermon: r.id, updatedAt: Date.now() }));
    if (ok) { delete S.drafts[path]; S.editingTranscript = false; render(); }
    else setStatus(path, 'error', S.lastErr);
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  lastInputAt = Date.now();
  const r = S.route;
  if (el.dataset.note) {
    const key = el.dataset.note;
    saveSoon('notes/' + key, { text: el.value, updatedAt: Date.now() }, 'set');
  } else if (el.id === 'l-title' || el.id === 'l-passage') {
    saveSoon('lessons/' + r.id, { [el.id === 'l-title' ? 'title' : 'passage']: el.value }, 'update');
    if (el.id === 'l-passage') { clearTimeout(el._t); el._t = setTimeout(() => scheduleRender(true), 900); }
  } else if (el.id === 'l-num') {
    if (el.value !== '' && Number.isFinite(+el.value)) saveSoon('lessons/' + r.id, { num: Math.round(+el.value) }, 'update');
  } else if (el.id === 'p-title' || el.id === 'p-body') {
    saveSoon('pages/' + r.id, { [el.id === 'p-title' ? 'title' : 'body']: el.value }, 'update');
  } else if (el.id === 'transcript-input') {
    S.drafts['transcripts/s' + r.id] = { text: el.value };
  } else if (el.id === 'find-in') {
    S.findIn = el.value; clearTimeout(el._t); el._t = setTimeout(() => scheduleRender(true), 250);
  } else if (el.id === 'find-sermon') {
    S.findLesson = el.value; clearTimeout(el._t); el._t = setTimeout(() => scheduleRender(true), 250);
  } else if (el.id === 'series-filter') {
    S.seriesFilter = el.value; clearTimeout(el._t); el._t = setTimeout(() => scheduleRender(true), 150);
  }
});

document.addEventListener('change', async e => {
  const el = e.target, r = S.route;
  if (el.id === 'sort') { S.sort = el.value; render(); }
  else if (el.id === 'type') { S.type = el.value; S.limit = 40; render(); }
  else if (el.id === 'mine') { S.mine = el.checked; S.limit = 40; render(); }
  else if (el.id === 'p-after') { saveSoon('pages/' + r.id, { after: +el.value }, 'update', 0); }
  else if (el.id === 'add-to-lesson') {
    if (el.value === '__new') await addLesson(r.id);
    else if (el.value) await toggleSermon('lesson', el.value, r.id, true);
  } else if (el.id === 'restore-file' && el.files && el.files[0]) {
    S.restore = await readBackup(el.files[0]); render();
  } else if (el.id === 'transcript-file' && el.files && el.files[0]) {
    const file = el.files[0];
    if (file.size > 240000) { setStatus('transcripts/s' + r.id, 'error', 'That file is too large. Transcripts can be up to about 240 KB.'); return; }
    const text = await file.text();
    const ta = $('#transcript-input');
    if (ta) { ta.value = text; S.drafts['transcripts/s' + r.id] = { text }; }
  }
});
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('#main')) { lastInputAt = 0; } });
window.addEventListener('hashchange', go);
window.addEventListener('pagehide', flushAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });

go();
startDb();
</script>
</body>
</html>
